function renderProgress(app){
  const exList = allExercisesWithHistory();
  if(!progressSelectedExercise && exList.length) progressSelectedExercise = exList[0].id;

  const statusInsight = generateProgressInsight();
  const statusCard=document.createElement('div');
  statusCard.className='glass-card insight-card';
  statusCard.style.marginBottom='16px';
  statusCard.innerHTML=`<div class="insight-status">${statusInsight.icon} Progress: ${escapeHtml(statusInsight.status)}</div><div class="insight-msg">${escapeHtml(statusInsight.message)}</div>`;
  app.appendChild(statusCard);

  // All-time stats
  const at = allTimeStats();
  const atCard=document.createElement('div');
  atCard.className='card';
  atCard.innerHTML=`<div class="card-title">All-Time Stats</div>
    <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);">
      <div class="stat-box"><div class="stat-num">${at.totalWorkouts}</div><div class="stat-lbl">Workouts</div></div>
      <div class="stat-box"><div class="stat-num">${at.totalSets}</div><div class="stat-lbl">Sets</div></div>
      <div class="stat-box"><div class="stat-num">${at.totalReps}</div><div class="stat-lbl">Reps</div></div>
      <div class="stat-box"><div class="stat-num">${Math.round(at.totalVolume).toLocaleString()}</div><div class="stat-lbl">Volume ${wu()}</div></div>
      <div class="stat-box"><div class="stat-num">🔥 ${at.currentStreak}</div><div class="stat-lbl">Streak</div></div>
      <div class="stat-box"><div class="stat-num">🏆 ${at.bestStreak}</div><div class="stat-lbl">Best Streak</div></div>
    </div>
    <div style="text-align:center; margin-top:10px; font-size:0.72rem; color:var(--text-muted);">Avg ${at.weeklyFreq.toFixed(1)} workouts/week</div>`;
  app.appendChild(atCard);

  // Body weight trend
  if(bodymetrics.bodyweight && bodymetrics.bodyweight.length>1){
    const bwCard=document.createElement('div');
    bwCard.className='card';
    bwCard.innerHTML=`<div class="card-title">Body Weight Trend</div>`;
    const bwSorted = bodymetrics.bodyweight.slice().sort((a,b)=>a.date.localeCompare(b.date));
    bwCard.appendChild(buildLineChart(bwSorted.slice(-60).map(e=>({date:e.date, value:e.weight}))));
    app.appendChild(bwCard);
  }

  const wk = getWeekWorkouts(0), lastWk = getWeekWorkouts(1);
  const wkVol=wk.reduce((s,w)=>s+workoutVolume(w),0), lastVol=lastWk.reduce((s,w)=>s+workoutVolume(w),0);
  const wkSets=wk.reduce((s,w)=>s+workoutWorkingSets(w),0), lastSets=lastWk.reduce((s,w)=>s+workoutWorkingSets(w),0);
  const wkDur=wk.length? wk.reduce((s,w)=>s+(w.durationSec||0),0)/wk.length : 0;

  const wkCard=document.createElement('div');
  wkCard.className='card';
  wkCard.innerHTML=`<div class="card-title">This Week vs Last Week</div>
    <div class="compare-row"><span>Workouts</span><span class="compare-val">${wk.length} <span style="color:var(--text-dim);">(${lastWk.length} last wk)</span></span></div>
    <div class="compare-row"><span>Sets</span><span class="compare-val ${wkSets>=lastSets?'up':'down'}">${wkSets} <span style="color:var(--text-dim);">(${wkSets-lastSets>=0?'+':''}${wkSets-lastSets})</span></span></div>
    <div class="compare-row"><span>Volume</span><span class="compare-val ${wkVol>=lastVol?'up':'down'}">${Math.round(wkVol).toLocaleString()} ${wu()}</span></div>
    <div class="compare-row"><span>Avg Duration</span><span class="compare-val">${wkDur?fmtDuration(wkDur):'—'}</span></div>
  `;
  app.appendChild(wkCard);

  // Muscle group weekly volume (with low-volume-vs-own-average flag)
  function mgVolumeFor(weekWorkouts){
    const m={};
    weekWorkouts.forEach(w=> (w.exercises||[]).forEach(ex=>{
      const mg = ex.muscleGroup || 'Other';
      const v = exerciseVolume(ex.sets);
      const setsCount = (ex.sets||[]).filter(s=>s.type!=='warmup' && s.weight!=='' && s.reps!=='').length;
      if(!m[mg]) m[mg]={vol:0, sets:0};
      m[mg].vol += v; m[mg].sets += setsCount;
    }));
    return m;
  }
  const mgVol = mgVolumeFor(wk);
  // average of previous 4 weeks (excluding current) for comparison
  const priorWeeks = [1,2,3,4].map(n=>mgVolumeFor(getWeekWorkouts(n)));
  const mgKeys = Object.keys(mgVol).filter(k=>mgVol[k].sets>0);
  if(mgKeys.length){
    const mgCard=document.createElement('div');
    mgCard.className='card';
    mgCard.innerHTML=`<div class="card-title">This Week — By Muscle Group</div>`;
    mgKeys.sort((a,b)=>mgVol[b].vol-mgVol[a].vol).forEach(mg=>{
      const priorVals = priorWeeks.map(pw=>pw[mg]?pw[mg].vol:0).filter(v=>v>0);
      const avgPrior = priorVals.length ? priorVals.reduce((a,b)=>a+b,0)/priorVals.length : null;
      const isLow = avgPrior && mgVol[mg].vol < avgPrior*0.6;
      const row=document.createElement('div'); row.className='pr-item';
      row.innerHTML=`<span class="pn">${escapeHtml(mg)}${isLow?' <span style="color:var(--gold); font-size:0.7rem;">⚠ lower than usual</span>':''}</span><span class="pv" style="color:var(--steel);">${Math.round(mgVol[mg].vol).toLocaleString()} ${wu()} · ${mgVol[mg].sets} sets</span>`;
      mgCard.appendChild(row);
    });
    app.appendChild(mgCard);
  }

  // PR list — user can pick their own "Top Exercises"; empty selection = show all (default)
  if(exList.length){
    const prCard=document.createElement('div');
    prCard.className='card';
    const usingCustom = favoriteExerciseIds.length>0;
    const prList = usingCustom ? favoriteExerciseIds.map(id=>exList.find(e=>e.id===id)).filter(Boolean) : exList;
    prCard.innerHTML=`<div class="card-title" style="display:flex; justify-content:space-between; align-items:center;">
      <span>${usingCustom?'Your Top Exercises':'Personal Records'}</span>
      <button class="btn btn-ghost btn-sm" id="prAddBtn">+ Add</button>
    </div>`;
    if(usingCustom && prList.length===0){
      const empty=document.createElement('div'); empty.style.cssText='text-align:center; color:var(--text-muted); font-size:0.82rem; padding:16px 0;';
      empty.textContent='No exercises pinned yet — tap + Add to choose your favorites.';
      prCard.appendChild(empty);
    }
    prList.forEach(ex=>{
      const best=bestSetForExercise(ex.id, null);
      const row=document.createElement('div'); row.className='pr-item';
      row.innerHTML=`<span class="pn">${escapeHtml(ex.name)}</span>
        <span style="display:flex; align-items:center; gap:10px;">
          <span class="pv">${best?`${best.weight}${wu()} × ${best.reps}`:'—'}</span>
          ${usingCustom?'<button class="pr-remove-btn" title="Remove">✕</button>':''}
        </span>`;
      if(usingCustom){
        row.querySelector('.pr-remove-btn').onclick=()=>{
          favoriteExerciseIds = favoriteExerciseIds.filter(id=>id!==ex.id);
          saveFavoriteExercises(); render();
        };
      }
      prCard.appendChild(row);
    });
    app.appendChild(prCard);
    prCard.querySelector('#prAddBtn').onclick=()=>{
      const pickable = exList.filter(e=>!favoriteExerciseIds.includes(e.id));
      openExerciseSearchPicker(pickable, (chosen)=>{
        favoriteExerciseIds.push(chosen.id);
        saveFavoriteExercises(); render();
      }, {title:'Add to Top Exercises'});
    };
  }

  if(exList.length===0){
    const empty=document.createElement('div'); empty.className='empty-state';
    empty.innerHTML=`<div class="plate-icon"></div><p>Complete a workout to start seeing your progress graphs and PRs here.</p>`;
    app.appendChild(empty);
    return;
  }

  const chartCard=document.createElement('div');
  chartCard.className='card';
  chartCard.innerHTML=`<div class="card-title">Exercise Progress</div>`;
  const curSelEx = exList.find(x=>x.id===progressSelectedExercise);
  const selBtn=document.createElement('button');
  selBtn.type='button';
  selBtn.className='ex-select-btn';
  selBtn.innerHTML=`<span>${escapeHtml(curSelEx?curSelEx.name:'Select exercise')}</span><span>🔍</span>`;
  selBtn.onclick=()=> openExerciseSearchPicker(exList, (chosen)=>{
    progressSelectedExercise=chosen.id; progressMetric='weight'; render();
  }, {title:'Select Exercise'});
  chartCard.appendChild(selBtn);

  const selEx = exList.find(x=>x.id===progressSelectedExercise);
  const selMode = selEx ? selEx.trackingMode : 'weight_reps';
  const isDurationType = selMode==='timed' || selMode==='cardio';

  const pillRow=document.createElement('div'); pillRow.className='pill-row';
  [['7d','7D'],['30d','30D'],['3m','3M'],['6m','6M'],['1y','1Y'],['all','ALL']].forEach(([k,l])=>{
    const p=document.createElement('button'); p.className='pill'+(progressRange===k?' active':''); p.textContent=l;
    p.onclick=()=>{ progressRange=k; render(); };
    pillRow.appendChild(p);
  });
  chartCard.appendChild(pillRow);

  const metricRow=document.createElement('div'); metricRow.className='pill-row';
  const metricOptions = selMode==='timed' ? [['duration','Best Duration'],['avgduration','Avg Duration']]
    : selMode==='cardio' ? [['duration','Duration'],['distance','Distance'],['pace','Pace']]
    : [['weight','Max Weight'],['1rm','Est. 1RM'],['reps','Top Reps'],['volume','Volume']];
  if(isDurationType && !['duration','avgduration','distance','pace'].includes(progressMetric)) progressMetric = metricOptions[0][0];
  metricOptions.forEach(([k,l])=>{
    const p=document.createElement('button'); p.className='pill'+(progressMetric===k?' active':''); p.textContent=l;
    p.onclick=()=>{ progressMetric=k; render(); };
    metricRow.appendChild(p);
  });
  chartCard.appendChild(metricRow);

  const chartWrap=document.createElement('div'); chartWrap.className='chart-wrap';

  if(isDurationType){
    const hist = historyForExerciseDuration(progressSelectedExercise, null).slice().reverse();
    const filtered = filterByRange(hist, progressRange);
    if(filtered.length<1){
      chartWrap.innerHTML=`<div style="text-align:center; color:var(--text-muted); font-size:0.82rem; padding:20px 0;">Not enough data in this range yet.</div>`;
    }else if(progressMetric==='avgduration'){
      chartWrap.appendChild(buildLineChart(filtered.map(r=>({date:r.date, value:Math.round(r.sets.reduce((a,s)=>a+Number(s.durationSec||0),0)/r.sets.length)})), 's'));
    }else if(progressMetric==='distance'){
      chartWrap.appendChild(buildLineChart(filtered.map(r=>({date:r.date, value:Math.round(r.sets.reduce((a,s)=>a+(Number(s.distanceKm)||0),0)*100)/100})), 'km'));
    }else if(progressMetric==='pace'){
      chartWrap.appendChild(buildLineChart(filtered.map(r=>{
        const totalDur=r.sets.reduce((a,s)=>a+Number(s.durationSec||0),0);
        const totalDist=r.sets.reduce((a,s)=>a+(Number(s.distanceKm)||0),0);
        const pace = totalDist>0 ? Math.round((totalDur/60/totalDist)*100)/100 : 0;
        return {date:r.date, value: pace};
      }), ' min/km'));
    }else{ // duration (best)
      chartWrap.appendChild(buildLineChart(filtered.map(r=>({date:r.date, value:Math.max(...r.sets.map(s=>Number(s.durationSec)||0))})), 's'));
    }
    chartCard.appendChild(chartWrap);

    const histLbl=document.createElement('div'); histLbl.className='card-title section-sp'; histLbl.textContent='Session History';
    chartCard.appendChild(histLbl);
    historyForExerciseDuration(progressSelectedExercise, null).forEach(row=>{
      const r=document.createElement('div'); r.className='history-item'; r.style.padding='10px 12px';
      r.innerHTML=`<div class="hi-date" style="font-size:0.82rem;">${fmtDateShort(row.date)}</div><div class="prev-chips">${row.sets.map(s=> selMode==='cardio' ? `<span class="set-chip">${fmtMMSS(s.durationSec)}${s.distanceKm?' · '+s.distanceKm+'km':''}</span>` : `<span class="set-chip">${fmtMMSS(s.durationSec)}</span>`).join('')}</div>`;
      chartCard.appendChild(r);
    });
  }else{
    const hist = historyForExercise(progressSelectedExercise, null).slice().reverse(); // oldest first
    const filtered = filterByRange(hist, progressRange);
    if(filtered.length<1){
      chartWrap.innerHTML=`<div style="text-align:center; color:var(--text-muted); font-size:0.82rem; padding:20px 0;">Not enough data in this range yet.</div>`;
    }else if(progressMetric==='1rm'){
      chartWrap.appendChild(buildLineChart(filtered.map(r=>{
        const top = r.sets.reduce((a,b)=> epley1RM(b.weight,b.reps)>epley1RM(a.weight,a.reps)?b:a, r.sets[0]);
        return {date:r.date, value: epley1RM(top.weight, top.reps)};
      })));
    }else if(progressMetric==='reps'){
      chartWrap.appendChild(buildLineChart(filtered.map(r=>({date:r.date, value:Math.max(...r.sets.map(s=>Number(s.reps)||0))})), ''));
    }else if(progressMetric==='volume'){
      chartWrap.appendChild(buildLineChart(filtered.map(r=>({date:r.date, value:Math.round(exerciseVolume(r.sets))})), ' '+wu()));
    }else{
      chartWrap.appendChild(buildLineChart(filtered.map(r=>({date:r.date, value:Math.max(...r.sets.map(s=>s.weight))}))));
    }
    chartCard.appendChild(chartWrap);

    // history table
    const histLbl=document.createElement('div'); histLbl.className='card-title section-sp'; histLbl.textContent='Session History';
    chartCard.appendChild(histLbl);
    historyForExercise(progressSelectedExercise, null).forEach(row=>{
      const r=document.createElement('div'); r.className='history-item'; r.style.padding='10px 12px';
      r.innerHTML=`<div class="hi-date" style="font-size:0.82rem;">${fmtDateShort(row.date)}</div><div class="prev-chips">${row.sets.map(s=>`<span class="set-chip">${s.weight}${wu()}×${s.reps}</span>`).join('')}</div>`;
      chartCard.appendChild(r);
    });
  }

  app.appendChild(chartCard);
}
function filterByRange(rows, range){
  if(range==='all') return rows;
  const days = {'7d':7,'30d':30,'3m':90,'6m':180,'1y':365}[range];
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-days);
  return rows.filter(r=> new Date(r.date+'T00:00:00') >= cutoff);
}
function buildLineChart(points, unitLabel){
  const unit = unitLabel===undefined ? wu() : unitLabel;
  const w=560,h=160,pad=28;
  const vals=points.map(p=>p.value);
  const min=Math.min(...vals), max=Math.max(...vals);
  const range = (max-min)||1;
  const stepX = points.length>1 ? (w-pad*2)/(points.length-1) : 0;
  const coords = points.map((p,i)=>{
    const x = pad + i*stepX;
    const y = h-pad - ((p.value-min)/range)*(h-pad*2);
    return [x,y];
  });
  const pathD = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const svgNS='http://www.w3.org/2000/svg';
  const container=document.createElement('div');
  container.innerHTML=`<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block;">
    <polyline points="${coords.map(c=>c.join(',')).join(' ')}" fill="none" stroke="#ff5a2e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${coords.map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="3.5" fill="#ff5a2e"/>`).join('')}
  </svg>
  <div style="display:flex; justify-content:space-between; font-size:0.65rem; color:var(--text-dim); margin-top:4px;">
    <span>${fmtDateShort(points[0].date)}</span><span>${fmtDateShort(points[points.length-1].date)}</span>
  </div>
  <div style="text-align:center; font-family:'JetBrains Mono',monospace; font-size:0.78rem; color:var(--text-muted); margin-top:4px;">Peak: ${max.toLocaleString()}${unit} · Start: ${points[0].value.toLocaleString()}${unit}</div>`;
  return container;
}

function renderHistory(app){
  const search=document.createElement('input');
  search.className='search-input'; search.placeholder='Search by exercise or date...';
  search.value=historySearch;
  search.oninput=(e)=>{ historySearch=e.target.value; renderHistoryList(); };
  app.appendChild(search);

  const calCard=document.createElement('div');
  calCard.className='card';
  calCard.appendChild(buildCalendar());
  app.appendChild(calCard);

  const listWrap=document.createElement('div');
  listWrap.id='historyListWrap';
  app.appendChild(listWrap);
  renderHistoryList();

  function renderHistoryList(){
    listWrap.innerHTML='';
    const q=historySearch.trim().toLowerCase();
    const filtered = pastWorkoutsSorted().filter(w=>{
      if(!q) return true;
      if(w.date.includes(q) || (w.planName||'').toLowerCase().includes(q)) return true;
      return (w.exercises||[]).some(e=>e.name.toLowerCase().includes(q));
    });
    if(filtered.length===0){
      listWrap.innerHTML=`<div class="empty-state"><div class="plate-icon"></div><p>No workouts found.</p></div>`;
      return;
    }
    filtered.forEach(w=>{
      const item=document.createElement('div');
      item.className='history-item';
      item.innerHTML=`<div><div class="hi-date">${fmtDateShort(w.date)}</div><div class="hi-plan">${escapeHtml(w.planName)}</div></div>
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="hi-stats">${workoutWorkingSets(w)} sets<br>${Math.round(workoutVolume(w)).toLocaleString()} ${wu()}</div>
          <button class="icon-btn" title="Repeat this workout" style="font-size:1.2rem;">↻</button>
        </div>`;
      item.querySelector('.icon-btn').onclick=(ev)=>{ ev.stopPropagation(); repeatWorkout(w); };
      item.onclick=()=>openWorkoutDetail(w);
      listWrap.appendChild(item);
    });
  }
}
function buildCalendar(){
  const wrap=document.createElement('div');
  const now=new Date();
  const viewDate=new Date(now.getFullYear(), now.getMonth()+calMonthOffset, 1);
  const monthLabel=viewDate.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const nav=document.createElement('div'); nav.className='cal-nav';
  nav.innerHTML=`<button class="icon-btn">‹</button><div class="cal-month">${monthLabel}</div><button class="icon-btn">›</button>`;
  nav.children[0].onclick=()=>{ calMonthOffset--; render(); };
  nav.children[2].onclick=()=>{ calMonthOffset=Math.min(0,calMonthOffset+1); render(); };
  wrap.appendChild(nav);

  const grid=document.createElement('div'); grid.className='cal-grid';
  ['M','T','W','T','F','S','S'].forEach(d=>{
    const el=document.createElement('div'); el.className='cal-dow'; el.textContent=d; grid.appendChild(el);
  });
  const firstDay = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
  const startOffset = (firstDay.getDay()+6)%7; // Monday=0
  for(let i=0;i<startOffset;i++){ const b=document.createElement('div'); b.className='cal-cell blank'; grid.appendChild(b); }
  const daysInMonth = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 0).getDate();
  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(viewDate.getFullYear(), viewDate.getMonth(), d);
    const iso = dateObj.toISOString().slice(0,10);
    const dayName = dateObj.toLocaleDateString('en-US',{weekday:'long'});
    const done = workouts.some(w=>w.date===iso);
    const isRestDay = plan[dayName] && plan[dayName].isRest;
    const isFuture = dateObj > now;
    const cell=document.createElement('div');
    cell.className='cal-cell'+(done?' done':(isRestDay?' rest-d':''))+(isFuture?' future':'');
    cell.textContent=d;
    if(done){ cell.onclick=()=>{ const w=workouts.find(x=>x.date===iso); if(w) openWorkoutDetail(w); }; cell.style.cursor='pointer'; }
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
  return wrap;
}
function openWorkoutDetail(w){
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  const vol=workoutVolume(w);
  overlay.innerHTML=`<div class="modal">
    <div class="modal-head"><div class="modal-title">${escapeHtml(w.planName)}</div><button class="modal-close">✕</button></div>
    <div style="color:var(--text-muted); font-size:0.82rem; margin-bottom:14px;">${fmtDateFull(w.date)} · ${w.durationSec?fmtDuration(w.durationSec):'—'}</div>
    <div class="sum-stat-grid">
      <div class="sum-stat"><div class="sn">${w.exercises.length}</div><div class="sl">Exercises</div></div>
      <div class="sum-stat"><div class="sn">${workoutWorkingSets(w)}</div><div class="sl">Sets</div></div>
      <div class="sum-stat"><div class="sn">${workoutTotalReps(w)}</div><div class="sl">Reps</div></div>
      <div class="sum-stat"><div class="sn">${Math.round(vol).toLocaleString()}</div><div class="sl">Volume</div></div>
    </div>
    <div id="detailExList"></div>
    ${w.notes?`<div class="card-title section-sp">Notes</div><div class="card" style="background:var(--surface-2);">${escapeHtml(w.notes)}</div>`:''}
    <button class="btn btn-steel btn-full section-sp" id="repeatWorkoutBtn">↻ Repeat This Workout</button>
    <div class="confirm-actions">
      <button class="btn btn-ghost btn-block" id="editWorkoutBtn">Edit</button>
      <button class="btn btn-danger btn-block" id="delWorkoutBtn">Delete</button>
    </div>
  </div>`;
  document.getElementById('modalRoot').appendChild(overlay);
  overlay.querySelector('.modal-close').onclick=()=>overlay.remove();
  overlay.onclick=(ev)=>{ if(ev.target===overlay) overlay.remove(); };
  overlay.querySelector('#repeatWorkoutBtn').onclick=()=>{
    overlay.remove();
    repeatWorkout(w);
  };
  const listEl=overlay.querySelector('#detailExList');
  w.exercises.forEach(ex=>{
    const mode = getExerciseTracking(ex);
    const working=ex.sets.filter(s=>s.type!=='warmup');
    const div=document.createElement('div'); div.className='card'; div.style.background='var(--surface-2)'; div.style.marginTop='10px';
    const title = escapeHtml(ex.name) + (ex.equipment ? ` <span class="ex-equip-tag">${escapeHtml(ex.equipment)}</span>` : '');
    let chips;
    if(mode==='timed'){
      chips = working.filter(s=>Number(s.durationSec)>0).map(s=>`<span class="set-chip">${fmtMMSS(s.durationSec)}</span>`).join('');
    }else if(mode==='cardio'){
      chips = working.filter(s=>Number(s.durationSec)>0).map(s=>`<span class="set-chip">${fmtMMSS(s.durationSec)}${s.distanceKm?' · '+s.distanceKm+'km':''}${s.speedKmh?' · '+s.speedKmh+'km/h':''}</span>`).join('');
    }else{
      chips = working.map(s=>`<span class="set-chip">${s.weight}${wu()} × ${s.reps}${s.rir!==''&&s.rir!=null?' · RIR '+s.rir:''}</span>`).join('');
    }
    div.innerHTML=`<div style="font-family:'Oswald',sans-serif; font-size:0.9rem; margin-bottom:6px;">${title}</div>
      <div class="prev-chips">${chips||'<span style="color:var(--text-dim); font-size:0.78rem;">No sets logged</span>'}</div>`;
    listEl.appendChild(div);
  });
  overlay.querySelector('#delWorkoutBtn').onclick=()=>{
    showConfirmModal('Are you sure you want to delete this workout? This cannot be undone.', ()=>{
      workouts = workouts.filter(x=>x.id!==w.id);
      saveWorkouts(); overlay.remove(); showToast('Workout deleted'); render();
    }, {title:'Delete Workout?', okLabel:'Delete', danger:true});
  };
  overlay.querySelector('#editWorkoutBtn').onclick=()=>{
    overlay.remove();
    openEditWorkout(w);
  };
}
function openEditWorkout(w){
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  const modal=document.createElement('div'); modal.className='modal';
  modal.innerHTML=`<div class="modal-head"><div class="modal-title">Edit Workout</div><button class="modal-close">✕</button></div>
    <div id="editExList"></div>
    <div class="form-group section-sp"><label class="form-label">Notes</label><textarea class="ex-notes" id="editNotes">${escapeHtml(w.notes||'')}</textarea></div>
    <button class="btn btn-primary btn-full" id="saveEditBtn">Save Changes</button>`;
  overlay.appendChild(modal);

const WATER_WAVE_SVG = `<svg viewBox="0 0 200 20" preserveAspectRatio="none"><path d="M0,10 Q25,0 50,10 T100,10 T150,10 T200,10 V20 H0 Z"/></svg>`;
function todayWaterEntries(){ return water.entries.filter(e=>e.date===todayISO()); }function waterEntriesForDate(iso){ return water.entries.filter(e=>e.date===iso).sort((a,b)=>a.timestamp-b.timestamp); }
function waterTotalForDate(iso){ return waterEntriesForDate(iso).reduce((s,e)=>s+e.amount,0); }
function estimateWaterGoal(){
  const bw = bodymetrics.bodyweight && bodymetrics.bodyweight.length ? bodymetrics.bodyweight[bodymetrics.bodyweight.length-1].weight : null;
  if(!bw) return 3000;
  // rough estimate: ~35ml per kg bodyweight, nudged up a bit for an active gym-goer
  return Math.round((bw*35)/50)*50;
}

    <div class="water-hero">
      <div class="water-jar">
        <div class="water-fill" style="height:${fillPct}%;">
          <div class="water-wave w1">${WATER_WAVE_SVG}${WATER_WAVE_SVG}</div>
          <div class="water-wave w2">${WATER_WAVE_SVG}${WATER_WAVE_SVG}</div>
        </div>
        <div class="water-jar-pct">${pct}%</div>
      </div>
      <div class="water-summary">
        <div class="ws-main">${(total/1000).toFixed(2)} L / ${(goal/1000).toFixed(1)} L</div>
        <div class="ws-sub">${isToday? `${remaining} ml remaining · ${servings} serving${servings===1?'':'s'}` : `${servings} serving${servings===1?'':'s'} logged that day`}</div>

    addCard.querySelector('#waterCustomAddBtn').onclick=()=>{
      const v=Number(addCard.querySelector('#waterCustomInput').value);
      if(v>0){ water.servingMl=Math.round(v); saveWater(); showToast(`Default serving set to ${Math.round(v)} ml`); render(); }

  function openCupPicker(){

    const modal=document.createElement('div');
    modal.className='modal';

      {v:200,label:'Small Cup'},{v:250,label:'Cup'},{v:300,label:'Glass'},
      {v:350,label:'Big Glass'},{v:500,label:'Bottle'},{v:750,label:'Large Bottle'},{v:1000,label:'Jug'}

    modal.innerHTML=`<div class="modal-head"><div class="modal-title">Choose Serving Size</div><button class="modal-close">✕</button></div>
      <div class="cup-grid">
        ${servingOptions.map(o=>{
          const scale = (0.55 + (o.v/maxV)*0.45).toFixed(2);
          return `<button type="button" class="cup-option" data-v="${o.v}">
            <span class="cup-icon" style="transform:scale(${scale});">🥤</span>
            <span class="cup-v">${o.v} ml</span>
            <span class="cup-lbl">${o.label}</span>
          </button>`;
        }).join('')}
      </div>`;

    document.getElementById('modalRoot').appendChild(overlay);
    overlay.querySelector('.modal-close').onclick=()=>overlay.remove();
    overlay.onclick=(ev)=>{ if(ev.target===overlay) overlay.remove(); };
    modal.querySelectorAll('.cup-option').forEach(btn=>{
      btn.onclick=()=>{

    <div style="display:flex; align-items:center; gap:10px;">

  app.appendChild(goalCard);
  goalCard.querySelector('#waterGoalSaveBtn').onclick=()=>{
    const v=Number(goalCard.querySelector('#waterGoalInput').value);
    if(v>0){ water.goalMl=Math.round(v); saveWater(); showToast('Goal updated'); render(); }
  };

  // Smart suggestion + creatine note
  const didWorkoutToday = workouts.some(w=>w.date===todayISO());
  const sugCard=document.createElement('div');
  sugCard.className='glass-card insight-card';
  sugCard.innerHTML=`<div class="insight-status">💧 Hydration Suggestion</div>
    <div class="insight-msg">Based on your body weight${didWorkoutToday?' and today\'s workout':''}, aim for roughly ${estimateWaterGoal() + (didWorkoutToday?500:0)} ml today. This is an estimate — adjust to what feels right for you.</div>`;
  app.appendChild(sugCard);

  const creatineCard=document.createElement('div');
  creatineCard.className='card';
  creatineCard.innerHTML=`<div class="toggle-row"><span style="font-size:0.88rem;">I take creatine</span><label class="switch"><input type="checkbox" id="waterCreatineToggle" ${water.takesCreatine?'checked':''}><span class="slider"></span></label></div>

  app.appendChild(creatineCard);
  creatineCard.querySelector('#waterCreatineToggle').onchange=(e)=>{ water.takesCreatine=e.target.checked; saveWater(); render(); };

  // Reminders
  const rem = water.reminders;
  const remCard=document.createElement('div');
  remCard.className='card';

    <div class="form-group" style="margin-top:10px;"><label class="form-label">Reminder Interval</label>
      <select class="form-input" id="remInterval">
        ${[30,45,60,90,120].map(v=>`<option value="${v}" ${rem.intervalMin==v?'selected':''}>${v} min</option>`).join('')}
      </select>
    </div>
    <div class="form-row" style="display:flex; gap:10px;">
      <div class="form-group" style="flex:1;"><label class="form-label">Start</label><input class="form-input" type="time" id="remStart" value="${rem.startTime}"></div>

    </div>
    <div class="form-group"><label class="form-label">Reminder Sound</label>
      <select class="form-input" id="remSound">
        <option value="drop" ${rem.sound==='drop'?'selected':''}>Water Drop</option>
        <option value="splash" ${rem.sound==='splash'?'selected':''}>Gentle Splash</option>
        <option value="silent" ${rem.sound==='silent'?'selected':''}>Silent</option>
      </select>
    </div>
    <button class="btn btn-primary btn-full" id="remSaveBtn" style="margin-top:6px;">Save Reminder Settings</button>
    <button type="button" class="btn" id="remTestBtn" style="margin-top:8px; width:100%; font-size:0.75rem;">🧪 Send Test Reminder (~1 min)</button>
    <div style="color:var(--text-muted); font-size:0.72rem; margin-top:10px;" id="remHint">${isNativeApp()?'When you enable reminders, we\'ll ask for notification permission first.':'Reminders only fire from the installed Android app, not the website.'}</div>`;
  app.appendChild(remCard);
  remCard.querySelector('#remTestBtn').onclick=()=> sendTestWaterReminder();
  remCard.querySelector('#remSaveBtn').onclick=async ()=>{
    const wantsEnabled = remCard.querySelector('#remEnable').checked;
    const newRem = {
      enabled: false, // set true below only after permission confirmed
      intervalMin: Number(remCard.querySelector('#remInterval').value),
      startTime: remCard.querySelector('#remStart').value,
      endTime: remCard.querySelector('#remEnd').value,
      sound: remCard.querySelector('#remSound').value
    };
    if(!wantsEnabled){
      water.reminders = newRem; saveWater();
      await cancelWaterReminders();
      showToast('Reminders turned off');
      render();
      return;
    }
    if(!isNativeApp()){
      showToast('Install the Android app to use reminders');
      return;
    }
    async function finishEnabling(){
      newRem.enabled = true;
      water.reminders = newRem; saveWater();
      await scheduleWaterReminders();
      showToast('Water reminders enabled 💧');
      render();
    }
    // If permission is already granted, don't show the explainer modal or request again — just save + schedule.

    openNotificationPermissionModal(async ()=>{
      const result = await ensureNotificationPermission(true);
      if(!result.granted){

      row.innerHTML=`<span style="font-family:'JetBrains Mono',monospace; font-size:0.78rem; color:var(--text-muted);">${t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span><span style="font-family:'JetBrains Mono',monospace; font-size:0.85rem;">+${e.amount} ml</span>`;
      if(isToday){
        const delBtn=document.createElement('button');
        delBtn.className='icon-btn'; delBtn.textContent='✕'; delBtn.style.fontSize='0.9rem';
        delBtn.onclick=()=>{ water.entries=water.entries.filter(x=>x.id!==e.id); saveWater(); render(); };

    totalRow.textContent=`Total: ${(waterTotalForDate(viewDate)/1000).toFixed(2)} L`;
    histCard.appendChild(totalRow);
  }
  app.appendChild(histCard);
}

function renderDiet(app){
  const dateEntries = dietLog[dietViewDate] || [];
  const totCal = dateEntries.reduce((s,f)=>s+Number(f.calories||0),0);
  const totPro = dateEntries.reduce((s,f)=>s+Number(f.protein||0),0);
  const calTarget = settings.calorieTarget||2200;
  const proTarget = settings.proteinTarget||150;

  const nav=document.createElement('div');
  nav.className='cal-nav';
  const isToday = dietViewDate===todayISO();
  nav.innerHTML=`<button class="icon-btn">‹</button><div class="cal-month">${isToday?'Today':fmtDateFull(dietViewDate)}</div><button class="icon-btn" ${isToday?'style="opacity:0.3;"':''}>›</button>`;
  nav.children[0].onclick=()=>{ const d=new Date(dietViewDate+'T12:00:00'); d.setDate(d.getDate()-1); dietViewDate=d.toISOString().slice(0,10); render(); };
  nav.children[2].onclick=()=>{ if(!isToday){ const d=new Date(dietViewDate+'T12:00:00'); d.setDate(d.getDate()+1); dietViewDate=d.toISOString().slice(0,10); render(); } };
  app.appendChild(nav);

  const sumCard=document.createElement('div');

function exportCSV(){
  let rows=[['date','day','exercise','set_number','type','weight','reps','rir']];
  pastWorkoutsSorted().forEach(w=>{
    w.exercises.forEach(ex=>{
      ex.sets.forEach((s,i)=>{
        rows.push([w.date, w.dayName, ex.name, i+1, s.type, s.weight, s.reps, s.rir]);
      });
    });
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',')).join('\n');
  try{
    const blob=new Blob([csv],{type:'text/csv'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='gym-workout-tracker-history.csv';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast('CSV downloaded');
  }catch(e){
    showToast('Export failed in this environment');
  }
}
async function clearAllData(){
  settings={name:'', weightUnit:'kg', restDefault:90, sound:true, soundIntensity:'normal', vibration:true, setupDone:false};

}

function nativeLocalNotifPlugin(){
  return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) || null;
}
function nativeAppPlugin(){
  return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) || null;

const WATER_REMINDER_ID_BASE = 90000; // reserved id range for water reminder notifications
const WATER_TEST_NOTIF_ID = 99999;
// v2 channel IDs: Android notification channels are IMMUTABLE once created (sound can't change after
// first creation). If an earlier build ever created a channel before the custom sound files existed,
// that old channel would be permanently stuck on the default sound. Bumping to _v2 guarantees a fresh
// channel that correctly picks up water_drop.wav / water_splash.wav, without touching/deleting the old one.
const WATER_CHANNELS = {
  drop:   {id:'water_drop_channel_v2',   name:'Water Reminders (Drop)',   sound:'water_drop.wav'},
  splash: {id:'water_splash_channel_v2', name:'Water Reminders (Splash)', sound:'water_splash.wav'},
  silent: {id:'water_silent_channel_v2', name:'Water Reminders (Silent)', sound:null},
};
let waterChannelsReady = false;
async function ensureWaterChannels(){
  const ln = nativeLocalNotifPlugin();
  if(!ln || waterChannelsReady) return;
  try{
    for(const key in WATER_CHANNELS){
      const c = WATER_CHANNELS[key];
      const opts = { id:c.id, name:c.name, importance:4, visibility:1, vibration:true };
      if(c.sound) opts.sound = c.sound;
      await ln.createChannel(opts);
    }
    waterChannelsReady = true;
  }catch(e){ /* channel creation isn't critical-path; reminders still work without a custom channel */ }
}
/**
 * Checks (and optionally requests) Android notification permission.
 * IMPORTANT: only pass requestIfNeeded=true from a direct user tap (Save / Test Reminder) —
 * never from background flows like app-resume or boot, since an unprompted system dialog
 * outside a user gesture is against Android guidelines and some OEMs auto-deny it.
 * Returns {granted, reason} instead of a bare boolean so callers can tell "genuinely denied"
 * apart from "couldn't confirm yet" and react appropriately.
 */
async function ensureNotificationPermission(requestIfNeeded){
  const ln = nativeLocalNotifPlugin();
  if(!ln) return {granted:false, reason:'unavailable'};
  try{
    let cur = await ln.checkPermissions();
    if(cur.display === 'granted') return {granted:true, reason:'granted'};
    if(!requestIfNeeded) return {granted:false, reason:cur.display};
    let res = await ln.requestPermissions();
    if(res.display !== 'granted'){
      // Settle-recheck: right after the OS dialog closes, the underlying permission state can
      // take a brief moment to propagate. Re-checking once after a short delay avoids treating
      // a just-granted permission as denied.
      await new Promise(r=>setTimeout(r,450));
      res = await ln.checkPermissions();
    }
    return {granted: res.display==='granted', reason: res.display};
  }catch(e){ return {granted:false, reason:'error'}; }
}
async function cancelWaterReminders(){
  const ln = nativeLocalNotifPlugin();
  if(!ln) return;
  try{
    const ids = [];
    for(let i=0;i<48;i++) ids.push({id: WATER_REMINDER_ID_BASE+i});
    await ln.cancel({ notifications: ids });
  }catch(e){}
}
async function scheduleWaterReminders(){
  const ln = nativeLocalNotifPlugin();
  if(!ln || !isNativeApp()) return;
  await cancelWaterReminders();
  const rem = water.reminders;
  if(!rem || !rem.enabled) return;
  // Only CHECK here — never re-request. Requesting must only ever happen from a direct user tap
  // (see the Save button and Test Reminder handlers), so this function is safe to call silently
  // on app resume / boot without ever popping an unexpected system dialog.
  const check = await ensureNotificationPermission(false);
  if(!check.granted) return;
  await ensureWaterChannels();
  const channel = WATER_CHANNELS[rem.sound] || WATER_CHANNELS.drop;
  const [sh,sm] = (rem.startTime||'08:00').split(':').map(Number);
  const [eh,em] = (rem.endTime||'22:00').split(':').map(Number);
  const interval = Math.max(15, Number(rem.intervalMin)||60);
  const now = new Date();
  const notifications = [];
  let idCounter = 0;
  // schedule for today and tomorrow so there's always a buffer even if the app isn't reopened
  for(let dayOffset=0; dayOffset<=1 && idCounter<48; dayOffset++){
    const dayStart = new Date(now); dayStart.setDate(now.getDate()+dayOffset);
    dayStart.setHours(sh, sm, 0, 0);
    const dayEnd = new Date(now); dayEnd.setDate(now.getDate()+dayOffset);
    dayEnd.setHours(eh, em, 0, 0);
    let t = new Date(dayStart);
    while(t <= dayEnd && idCounter<48){
      if(t > now){
        notifications.push({
          id: WATER_REMINDER_ID_BASE + idCounter,
          title: 'Time to hydrate 💧',
          body: `Stay on track — log a glass of water in Gym Tracker.`,
          schedule: { at: new Date(t) },
          channelId: channel.id,
          smallIcon: 'ic_stat_water',
        });
        idCounter++;
      }
      t = new Date(t.getTime() + interval*60000);
    }
  }
  if(notifications.length){
    try{ await ln.schedule({ notifications }); }catch(e){}
  }
}
async function sendTestWaterReminder(){
  if(!isNativeApp()){ showToast('Install the Android app to test reminders'); return; }
  const ln = nativeLocalNotifPlugin();
  if(!ln){ showToast('Notifications plugin not available — run npx cap sync android'); return; }
  const check = await ensureNotificationPermission(true); // direct user tap — OK to request here
  if(!check.granted){
    if(check.reason==='denied') openPermissionDeniedModal();
    else showToast('Could not confirm notification permission — try again');
    return;
  }
  await ensureWaterChannels();
  const rem = water.reminders || {sound:'drop'};
  const channel = WATER_CHANNELS[rem.sound] || WATER_CHANNELS.drop;
  try{
    await ln.cancel({ notifications:[{id:WATER_TEST_NOTIF_ID}] });
    await ln.schedule({ notifications:[{
      id: WATER_TEST_NOTIF_ID,
      title: 'Time to hydrate 💧 (Test)',
      body: 'This is a test water reminder — your real reminders will look like this.',
      schedule: { at: new Date(Date.now()+60000) },
      channelId: channel.id,
      smallIcon: 'ic_stat_water',
    }]});
    showToast('Test reminder scheduled — check in ~1 min');
  }catch(e){ showToast('Could not schedule test reminder'); }
}
function initNativeWaterReminders(){
  if(!isNativeApp()) return;
  scheduleWaterReminders();
  const app = nativeAppPlugin();
  if(app && app.addListener){
    app.addListener('resume', ()=> scheduleWaterReminders());
  }
}

/* ================= START ================= */
loadAll().then(()=>{ initFirebase(); tryAutoConnectSyncCode(); initNativeWaterReminders(); runStartupUpdateCheck(); });
