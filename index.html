<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gym Tracker — Workout Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101215; --surface:#1b1e23; --surface-2:#22262c; --surface-3:#282d34;
  --border:#2c3038; --text:#f0eee9; --text-muted:#8b929c; --text-dim:#5c626c;
  --accent:#ff5a2e; --accent-dim:#ff5a2e26; --accent-text:#17130f;
  --steel:#4fc3dc; --steel-dim:#4fc3dc22;
  --good:#4caf7d; --good-dim:#4caf7d22;
  --danger:#e05c5c; --danger-dim:#e05c5c22;
  --gold:#e8b64c; --gold-dim:#e8b64c22;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
  min-height:100vh; padding-bottom:78px; overflow-x:hidden;
}
::selection{background:var(--accent-dim);}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; color:var(--text);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--steel); outline-offset:0;}
h1,h2,h3{font-family:'Oswald',sans-serif; text-transform:uppercase;}
.mono{font-family:'JetBrains Mono',monospace;}

/* Header */
.app-header{
  position:sticky; top:0; z-index:40;
  background:rgba(16,18,21,0.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
  padding:14px 16px; display:flex; align-items:center; justify-content:space-between;
}
.brand{font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:2px; font-size:1.25rem;}
.brand span{color:var(--accent);}
.header-right{display:flex; align-items:center; gap:10px;}
.streak-chip{
  display:flex; align-items:center; gap:5px;
  background:var(--surface); border:1px solid var(--border);
  padding:6px 10px; border-radius:20px; font-size:0.78rem; color:var(--text-muted);
  font-family:'JetBrains Mono',monospace;
}
.streak-chip.active{color:var(--accent); border-color:#ff5a2e44;}
.gear-btn{
  background:var(--surface); border:1px solid var(--border); color:var(--text-muted);
  width:36px; height:36px; border-radius:8px; font-size:1rem; display:flex; align-items:center; justify-content:center;
}

.container{max-width:640px; margin:0 auto; padding:16px;}

/* Cards */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:16px; margin-bottom:14px;
}
.card-title{
  font-size:0.72rem; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-muted);
  margin-bottom:10px; display:flex; align-items:center; justify-content:space-between;
}

/* Buttons */
.btn{
  border:none; border-radius:9px; padding:13px 18px; font-family:'Oswald',sans-serif;
  font-weight:600; letter-spacing:0.5px; text-transform:uppercase; font-size:0.85rem;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  transition:transform 0.1s ease;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--accent); color:var(--accent-text); width:100%;}
.btn-steel{background:var(--steel); color:#0d1a1d;}
.btn-ghost{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
.btn-danger{background:var(--danger-dim); color:var(--danger); border:1px solid #e05c5c44;}
.btn-sm{padding:8px 12px; font-size:0.72rem; border-radius:7px;}
.btn-block{width:100%;}
.btn-full{width:100%; padding:16px; font-size:0.95rem;}
.btn:disabled{opacity:0.4; pointer-events:none;}
.icon-btn{background:none; border:none; color:var(--text-muted); font-size:1.05rem; padding:4px; line-height:1;}
.icon-btn:hover{color:var(--text);}
.icon-btn.danger:hover{color:var(--danger);}

/* Dashboard */
.today-hero{
  background:linear-gradient(145deg, var(--surface) 0%, var(--surface-2) 100%);
  border:1px solid var(--border); border-radius:16px; padding:24px 20px; margin-bottom:16px;
  text-align:center; position:relative; overflow:hidden;
}
.today-hero::before{
  content:""; position:absolute; top:-40%; right:-20%; width:220px; height:220px;
  background:radial-gradient(circle, var(--accent-dim) 0%, transparent 70%);
}
.today-label{color:var(--text-muted); font-size:0.75rem; letter-spacing:2px; text-transform:uppercase;}
.today-daynum{font-family:'Oswald',sans-serif; font-size:1.1rem; letter-spacing:2px; margin-top:4px; color:var(--text-muted);}
.today-workout-name{font-family:'Oswald',sans-serif; font-size:2.2rem; font-weight:700; letter-spacing:1px; margin:8px 0 18px; text-transform:uppercase;}
.today-workout-name.rest{color:var(--text-muted);}

.week-list{display:flex; flex-direction:column; gap:6px;}
.week-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:11px 14px; border-radius:9px; background:var(--surface-2); border:1px solid transparent;
}
.week-row.today{border-color:var(--accent); background:var(--accent-dim);}
.week-row .wd{font-family:'Oswald',sans-serif; font-size:0.78rem; letter-spacing:1px; color:var(--text-muted); width:44px;}
.week-row.today .wd{color:var(--accent);}
.week-row .wn{flex:1; font-size:0.88rem; padding-left:8px;}
.week-row .wn.rest{color:var(--text-dim); font-style:italic;}

.stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.stat-box{background:var(--surface-2); border-radius:9px; padding:12px 8px; text-align:center;}
.stat-num{font-family:'JetBrains Mono',monospace; font-size:1.15rem; font-weight:700; color:var(--text);}
.stat-lbl{font-size:0.65rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-top:2px;}

.resume-banner{
  background:var(--accent-dim); border:1px solid #ff5a2e55; border-radius:12px;
  padding:14px 16px; margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.resume-banner .rtxt{font-size:0.85rem;}
.resume-banner .rtime{font-family:'JetBrains Mono',monospace; color:var(--accent); font-weight:700;}

/* Bottom nav */
.bottom-nav{
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  background:rgba(16,18,21,0.96); backdrop-filter:blur(8px); border-top:1px solid var(--border);
  display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.nav-item{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none; color:var(--text-dim); padding:8px 2px; border-radius:8px; font-size:0.62rem;
  text-transform:uppercase; letter-spacing:0.5px; font-family:'Oswald',sans-serif;
}
.nav-item .ni-icon{font-size:1.15rem;}
.nav-item.active{color:var(--accent);}

/* Day tabs (plan editor) */
.day-tabs{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 14px; scrollbar-width:none;}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tab{
  flex:0 0 auto; background:var(--surface); border:1px solid var(--border); color:var(--text-muted);
  font-family:'Oswald',sans-serif; letter-spacing:1px; text-transform:uppercase; font-size:0.78rem;
  padding:9px 14px; border-radius:8px;
}
.day-tab.active{background:var(--accent); border-color:var(--accent); color:var(--accent-text); font-weight:600;}
.day-tab.rest-marked{opacity:0.55;}

.form-group{margin-bottom:14px;}
.form-label{font-size:0.72rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; display:block;}
.form-input{
  width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  padding:11px 13px; border-radius:8px; font-size:0.9rem;
}
.form-row{display:flex; gap:10px;}
.form-row > *{flex:1;}
.toggle-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0;}
.switch{position:relative; width:44px; height:24px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.slider{position:absolute; inset:0; background:var(--surface-3); border-radius:20px; transition:0.2s; border:1px solid var(--border);}
.slider::before{content:""; position:absolute; width:18px; height:18px; left:2px; top:2px; background:var(--text-muted); border-radius:50%; transition:0.2s;}
.switch input:checked + .slider{background:var(--accent-dim); border-color:var(--accent);}
.switch input:checked + .slider::before{transform:translateX(20px); background:var(--accent);}

.plan-ex-card{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:9px;}
.plan-ex-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
.plan-ex-name{font-family:'Oswald',sans-serif; font-size:0.95rem; letter-spacing:0.3px;}
.plan-ex-muscle{font-size:0.68rem; color:var(--steel); text-transform:uppercase; letter-spacing:0.5px; margin-top:2px;}
.plan-ex-meta{display:flex; gap:12px; margin-top:8px; font-size:0.72rem; color:var(--text-muted); font-family:'JetBrains Mono',monospace; flex-wrap:wrap;}
.plan-ex-actions{display:flex; gap:2px; flex-shrink:0;}

.empty-state{text-align:center; padding:48px 20px; color:var(--text-muted);}
.plate-icon{width:64px; height:64px; margin:0 auto 14px; border-radius:50%; border:6px solid var(--border); position:relative;}
.plate-icon::before{content:""; position:absolute; inset:13px; border-radius:50%; border:3px solid var(--border);}
.empty-state p{font-size:0.88rem; max-width:280px; margin:0 auto;}

/* Modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(8,9,11,0.75); backdrop-filter:blur(3px);
  z-index:100; display:flex; align-items:flex-end; justify-content:center;
}
.modal-overlay.center{align-items:center; padding:16px;}
.modal{
  background:var(--surface); border:1px solid var(--border); border-radius:18px 18px 0 0;
  width:100%; max-width:640px; max-height:88vh; overflow-y:auto; padding:20px;
}
.modal-overlay.center .modal{border-radius:16px; max-height:85vh;}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-title{font-family:'Oswald',sans-serif; font-size:1.1rem; letter-spacing:1px; text-transform:uppercase;}
.modal-close{background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted); width:32px; height:32px; border-radius:8px; font-size:1rem;}

/* Exercise picker */
.search-input{
  width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  padding:11px 13px; border-radius:9px; font-size:0.9rem; margin-bottom:14px;
}
.lib-cat{font-family:'Oswald',sans-serif; font-size:0.72rem; letter-spacing:1.5px; color:var(--text-muted); text-transform:uppercase; margin:14px 0 8px;}
.lib-item{
  display:flex; align-items:center; justify-content:space-between;
  padding:11px 4px; border-bottom:1px solid var(--border); font-size:0.9rem;
}
.lib-item button{background:var(--steel-dim); color:var(--steel); border:1px solid #4fc3dc44; border-radius:6px; padding:5px 12px; font-size:0.72rem; font-family:'Oswald',sans-serif; text-transform:uppercase;}

/* Workout screen */
.workout-topbar{
  position:sticky; top:57px; z-index:30; background:var(--bg); padding:10px 16px 14px;
  border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;
}
.wt-info .wt-name{font-family:'Oswald',sans-serif; font-size:1.1rem; letter-spacing:0.5px; text-transform:uppercase;}
.wt-info .wt-timer{font-family:'JetBrains Mono',monospace; color:var(--accent); font-size:0.85rem; margin-top:2px;}

.ex-track-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:12px; overflow:hidden;}
.ex-track-head{padding:14px 16px; display:flex; align-items:center; justify-content:space-between; cursor:pointer;}
.ex-track-name{font-family:'Oswald',sans-serif; font-size:1rem; letter-spacing:0.3px; text-transform:uppercase;}
.ex-track-sub{font-size:0.72rem; color:var(--text-muted); margin-top:2px;}
.ex-track-body{display:none; padding:0 16px 16px; border-top:1px solid var(--border);}
.ex-track-card.open .ex-track-body{display:block;}
.ex-track-card.open .chevron{transform:rotate(180deg);}
.chevron{color:var(--text-muted); transition:transform 0.2s; font-size:0.75rem;}

.prev-box{background:var(--surface-2); border-radius:9px; padding:12px 14px; margin-top:12px;}
.prev-box .pb-label{font-size:0.68rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;}
.prev-chips{display:flex; flex-wrap:wrap; gap:5px;}
.set-chip{background:var(--steel-dim); border:1px solid #4fc3dc44; color:var(--steel); font-family:'JetBrains Mono',monospace; font-size:0.72rem; padding:3px 8px; border-radius:5px;}
.suggestion-txt{font-size:0.78rem; color:var(--gold); margin-top:8px; display:flex; align-items:center; gap:5px;}

.set-row{display:flex; align-items:center; gap:6px; margin-top:9px;}
.set-tag{width:22px; text-align:center; font-family:'JetBrains Mono',monospace; font-size:0.68rem; color:var(--text-dim);}
.set-tag.warm{color:var(--steel);}
.set-row input{background:var(--surface-2); border:1px solid var(--border); padding:10px; border-radius:7px; width:64px; font-family:'JetBrains Mono',monospace; font-size:0.88rem; text-align:center;}
.set-row select{background:var(--surface-2); border:1px solid var(--border); padding:10px 4px; border-radius:7px; font-size:0.78rem; width:56px;}
.set-row .u{font-size:0.68rem; color:var(--text-muted);}
.set-row .rm{background:none; border:none; color:var(--text-dim); margin-left:auto; font-size:1rem;}
.setrow-labels{display:flex; gap:6px; margin-top:12px; font-size:0.62rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px;}
.setrow-labels span:nth-child(1){width:22px;}
.setrow-labels span:nth-child(2){width:64px; text-align:center;}
.setrow-labels span:nth-child(3){width:64px; text-align:center; margin-left:26px;}

.add-set-row{display:flex; gap:8px; margin-top:12px;}
.add-set-row button{flex:1; background:transparent; border:1px dashed var(--border); color:var(--steel); padding:9px; border-radius:7px; font-size:0.72rem; font-family:'Oswald',sans-serif; text-transform:uppercase;}
.add-set-row button.warmup-btn{color:var(--text-muted);}

.ex-notes{width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:8px; font-size:0.82rem; margin-top:12px; resize:vertical; min-height:44px;}

.rest-widget{
  position:fixed; bottom:78px; left:0; right:0; z-index:50;
  background:var(--accent); color:var(--accent-text); padding:14px 18px;
  display:flex; align-items:center; justify-content:space-between; box-shadow:0 -4px 20px rgba(0,0,0,0.3);
}
.rest-widget .rw-time{font-family:'JetBrains Mono',monospace; font-size:1.6rem; font-weight:700;}
.rest-widget .rw-label{font-size:0.65rem; text-transform:uppercase; letter-spacing:1.5px; opacity:0.75;}
.rest-widget .rw-actions{display:flex; gap:8px;}
.rw-btn{background:rgba(0,0,0,0.18); border:none; color:var(--accent-text); padding:9px 13px; border-radius:8px; font-size:0.72rem; font-family:'Oswald',sans-serif; text-transform:uppercase; font-weight:600;}

/* Summary modal */
.summary-hero{text-align:center; padding:8px 0 18px;}
.summary-hero .se{font-size:2rem;}
.summary-hero h2{font-size:1.3rem; margin-top:6px;}
.summary-hero .sw{color:var(--text-muted); font-size:0.85rem; margin-top:2px;}
.sum-stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px;}
.sum-stat{background:var(--surface-2); border-radius:9px; padding:10px 6px; text-align:center;}
.sum-stat .sn{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:1rem;}
.sum-stat .sl{font-size:0.6rem; color:var(--text-muted); text-transform:uppercase; margin-top:2px;}
.progress-line{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:0.82rem;}
.progress-line:last-child{border-bottom:none;}
.progress-line .pl-arrow{color:var(--good); font-family:'JetBrains Mono',monospace; font-size:0.8rem;}
.pr-line{display:flex; align-items:center; gap:8px; padding:6px 0; font-size:0.85rem; color:var(--gold);}
.compare-row{display:flex; align-items:center; justify-content:space-between; padding:8px 0; font-size:0.85rem;}
.compare-val{font-family:'JetBrains Mono',monospace;}
.compare-val.up{color:var(--good);}
.compare-val.down{color:var(--text-muted);}

/* History / calendar */
.history-item{background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:13px 15px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between;}
.hi-date{font-family:'Oswald',sans-serif; font-size:0.95rem;}
.hi-plan{font-size:0.72rem; color:var(--text-muted); margin-top:2px;}
.hi-stats{text-align:right; font-family:'JetBrains Mono',monospace; font-size:0.72rem; color:var(--text-muted);}

.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:10px;}
.cal-dow{text-align:center; font-size:0.62rem; color:var(--text-dim); text-transform:uppercase; padding-bottom:4px;}
.cal-cell{aspect-ratio:1; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-direction:column; font-size:0.72rem; background:var(--surface-2); position:relative;}
.cal-cell.blank{background:transparent;}
.cal-cell.done{background:var(--good-dim); color:var(--good);}
.cal-cell.rest-d{background:var(--surface-3); color:var(--text-dim);}
.cal-cell.future{opacity:0.4;}
.cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
.cal-month{font-family:'Oswald',sans-serif; letter-spacing:1px; text-transform:uppercase; font-size:0.9rem;}

/* Progress page */
.pill-row{display:flex; gap:6px; overflow-x:auto; margin-bottom:14px; scrollbar-width:none;}
.pill-row::-webkit-scrollbar{display:none;}
.pill{flex:0 0 auto; background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted); padding:7px 13px; border-radius:20px; font-size:0.75rem;}
.pill.active{background:var(--steel-dim); color:var(--steel); border-color:#4fc3dc55;}
.chart-wrap{background:var(--surface-2); border-radius:10px; padding:14px 10px 6px; margin-top:10px;}
.pr-item{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border);}
.pr-item:last-child{border-bottom:none;}
.pr-item .pn{font-size:0.88rem;}
.pr-item .pv{font-family:'JetBrains Mono',monospace; color:var(--gold); font-size:0.85rem;}

.toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(16px); background:var(--surface-3); border:1px solid var(--border); color:var(--text); padding:11px 18px; border-radius:9px; font-size:0.82rem; opacity:0; transition:all 0.25s ease; pointer-events:none; z-index:200; white-space:nowrap;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.section-sp{margin-top:22px;}
.hint-banner{background:var(--steel-dim); border:1px solid #4fc3dc44; color:var(--steel); padding:12px 14px; border-radius:10px; font-size:0.82rem; margin-bottom:14px;}
.link-row{display:flex; align-items:center; justify-content:space-between; padding:13px 2px; border-bottom:1px solid var(--border); font-size:0.88rem;}
.link-row:last-child{border-bottom:none;}
.confirm-actions{display:flex; gap:10px; margin-top:18px;}
.confirm-actions .btn{flex:1;}
@media(max-width:400px){.set-row input{width:56px;} .sum-stat-grid{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>

<div class="app-header">
  <div class="brand">GYM <span>TRACKER</span></div>
  <div class="header-right">
    <div class="streak-chip" id="streakChip">🔥 0</div>
    <button class="gear-btn" id="settingsBtn">⚙</button>
  </div>
</div>

<div class="container" id="app"></div>

<div class="bottom-nav" id="bottomNav"></div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<div id="restWidgetRoot"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ================= DATA ================= */
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const EXLIB = {
  Chest:['Bench Press','Incline Bench Press','Dumbbell Bench Press','Incline Dumbbell Press','Machine Chest Press','Cable Fly','Pec Deck'],
  Back:['Lat Pulldown','Pull-Ups','Seated Cable Row','Chest Supported Row','Barbell Row','Machine Row','Face Pull'],
  Shoulders:['Shoulder Press','Dumbbell Shoulder Press','Machine Shoulder Press','Lateral Raise','Rear Delt Fly','Reverse Pec Deck'],
  Biceps:['Dumbbell Curl','Barbell Curl','Hammer Curl','Preacher Curl','Cable Curl'],
  Triceps:['Triceps Pushdown','Rope Pushdown','Overhead Cable Extension','Skull Crusher','Dumbbell Overhead Extension'],

/* ================= UTIL ================= */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function todayDayName(){ return new Date().toLocaleDateString('en-US',{weekday:'long'}); }
function fmtDateShort(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); }
function fmtDateFull(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDuration(sec){
  sec = Math.max(0, Math.floor(sec));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  if(h>0) return `${h}h ${m}m`;
  return `${m}m ${s<10?'0':''}${s}s`;
}
function fmtClock(sec){
  sec=Math.max(0,Math.floor(sec));
  const m=Math.floor(sec/60), s=sec%60;
  return `${m}:${s<10?'0':''}${s}`;
}
function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str==null?'':str; return d.innerHTML; }
function epley1RM(w,r){ if(!w||!r) return 0; return Math.round(w*(1+r/30)*10)/10; }
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ================= STORAGE (localStorage — persists on this device/browser) ================= */
const LS_PREFIX = 'ironlog:';
function lsGet(key){ try{ const v=localStorage.getItem(LS_PREFIX+key); return v==null?null:v; }catch(e){ return null; } }
function lsSet(key,val){ try{ localStorage.setItem(LS_PREFIX+key,val); return true; }catch(e){ return false; } }
function lsDelete(key){ try{ localStorage.removeItem(LS_PREFIX+key); }catch(e){} }

async function loadAll(){
  try{ const r=lsGet('settings'); if(r) settings=Object.assign(settings, JSON.parse(r)); }catch(e){}
  try{ const r=lsGet('plan'); if(r) plan=JSON.parse(r); }catch(e){}
  DAYS.forEach(d=>{ if(!plan[d]) plan[d]={name:'', isRest:false, exercises:[]}; });
  try{ const r=lsGet('workouts'); if(r) workouts=JSON.parse(r); }catch(e){ workouts=[]; }
  try{ const r=lsGet('activeWorkout'); if(r) activeWorkout=JSON.parse(r); }catch(e){ activeWorkout=null; }
  try{ const r=lsGet('bodymetrics'); if(r) bodymetrics=JSON.parse(r); }catch(e){}
  await tryAutoConnectSync();
  if(!settings.setupDone){ view='onboarding'; }
  boot();
}
async function saveSettings(){ if(!lsSet('settings', JSON.stringify(settings))) showToast('Save failed'); scheduleCloudPush(); }
async function savePlan(){ if(!lsSet('plan', JSON.stringify(plan))) showToast('Save failed'); scheduleCloudPush(); }
async function saveWorkouts(){ if(!lsSet('workouts', JSON.stringify(workouts))) showToast('Save failed'); scheduleCloudPush(); }
async function saveActiveWorkout(){ if(activeWorkout){ lsSet('activeWorkout', JSON.stringify(activeWorkout)); } else { lsDelete('activeWorkout'); } scheduleCloudPush(); }
async function saveBodymetrics(){ lsSet('bodymetrics', JSON.stringify(bodymetrics)); scheduleCloudPush(); }

/* ================= CLOUD SYNC (optional, Firebase) ================= */
let syncCfg = null;      // firebase config object
let syncCode = '';       // user-chosen sync code (like a PIN)
let syncDb = null;
let syncConnected = false;
let syncPushTimer = null;
let syncStatus = 'off';  // off | connecting | synced | error

function loadSyncSettings(){
  try{
    const raw = lsGet('syncSettings');
    if(raw){
      const s = JSON.parse(raw);
      syncCfg = s.config || null;
      syncCode = s.code || '';
    }
  }catch(e){}
}
function saveSyncSettings(){
  lsSet('syncSettings', JSON.stringify({config: syncCfg, code: syncCode}));
}
function bundleData(){
  return { settings, plan, workouts, activeWorkout, bodymetrics, updatedAt: Date.now() };
}
function applyBundle(b){
  if(b.settings) settings = Object.assign(settings, b.settings);
  if(b.plan) plan = b.plan;
  DAYS.forEach(d=>{ if(!plan[d]) plan[d]={name:'',isRest:false,exercises:[]}; });
  if(b.workouts) workouts = b.workouts;
  if('activeWorkout' in b) activeWorkout = b.activeWorkout;
  if(b.bodymetrics) bodymetrics = b.bodymetrics;
  lsSet('settings', JSON.stringify(settings));
  lsSet('plan', JSON.stringify(plan));
  lsSet('workouts', JSON.stringify(workouts));
  if(activeWorkout) lsSet('activeWorkout', JSON.stringify(activeWorkout)); else lsDelete('activeWorkout');
  lsSet('bodymetrics', JSON.stringify(bodymetrics));
}
async function connectSync(configObj, code){
  try{
    syncStatus='connecting';
    if(!window.firebase){ syncStatus='error'; return {ok:false, msg:'Firebase SDK failed to load — check your internet connection.'}; }
    if(!firebase.apps || !firebase.apps.length){ firebase.initializeApp(configObj); } else { firebase.app(); }
    syncDb = firebase.firestore();
    syncCfg = configObj; syncCode = code;
    saveSyncSettings();
    // try a read to confirm access
    const docRef = syncDb.collection('ironlog_sync').doc(code);
    const snap = await docRef.get();
    syncConnected = true; syncStatus='synced';
    if(snap.exists){
      const remote = snap.data();
      const localBundle = bundleData();
      if((remote.updatedAt||0) > (localBundle.updatedAt||0) - 5000){
        applyBundle(remote);
      }else{
        await docRef.set(localBundle);
      }
    }else{
      await docRef.set(bundleData());
    }
    return {ok:true};
  }catch(e){
    syncStatus='error'; syncConnected=false;
    return {ok:false, msg:e.message||'Could not connect.'};
  }
}
function scheduleCloudPush(){
  if(!syncConnected || !syncDb) return;
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(async ()=>{
    try{
      await syncDb.collection('ironlog_sync').doc(syncCode).set(bundleData());
      syncStatus='synced';
    }catch(e){ syncStatus='error'; }
  }, 1200);
}
async function pullCloudNow(){
  if(!syncConnected || !syncDb) return {ok:false, msg:'Not connected.'};
  try{
    const snap = await syncDb.collection('ironlog_sync').doc(syncCode).get();
    if(snap.exists){ applyBundle(snap.data()); }
    return {ok:true};
  }catch(e){ return {ok:false, msg:e.message}; }
}
function disconnectSync(){
  syncConnected=false; syncCfg=null; syncCode=''; syncDb=null; syncStatus='off';
  lsDelete('syncSettings');
}
async function tryAutoConnectSync(){
  loadSyncSettings();
  if(syncCfg && syncCode){
    const r = await connectSync(syncCfg, syncCode);
    return r;
  }
  return {ok:false};
}

/* ================= HISTORY / STATS HELPERS ================= */
function pastWorkoutsSorted(){ return [...workouts].sort((a,b)=> b.date.localeCompare(a.date) || b.startTime-a.startTime); }
function historyForExercise(exId, excludeWorkoutId){
  const rows=[];
  pastWorkoutsSorted().forEach(w=>{
    if(w.id===excludeWorkoutId) return;
    (w.exercises||[]).forEach(e=>{
      if(e.exerciseId===exId){
        const working=(e.sets||[]).filter(s=>s.type!=='warmup' && s.weight!=='' && s.reps!=='' && s.weight!=null && s.reps!=null);
        if(working.length) rows.push({date:w.date, sets:working, workoutId:w.id});
      }
    });
  });
  return rows;
}
function bestSetForExercise(exId, excludeWorkoutId){
  let best=null;
  historyForExercise(exId, excludeWorkoutId).forEach(row=>{
    row.sets.forEach(s=>{
      if(!best || s.weight>best.weight || (s.weight===best.weight && s.reps>best.reps)) best={weight:s.weight, reps:s.reps, date:row.date};
    });
  });
  return best;
}
function maxWeightForExercise(exId, excludeWorkoutId){
  let max=0;
  historyForExercise(exId, excludeWorkoutId).forEach(row=> row.sets.forEach(s=>{ if(s.weight>max) max=s.weight; }));
  return max;
}
function exerciseVolume(sets){
  return (sets||[]).filter(s=>s.type!=='warmup' && s.weight!=='' && s.reps!=='' && s.weight!=null && s.reps!=null)
    .reduce((sum,s)=> sum + (Number(s.weight)*Number(s.reps)), 0);
}
function workoutVolume(w){ return (w.exercises||[]).reduce((s,e)=> s+exerciseVolume(e.sets), 0); }
function workoutWorkingSets(w){ return (w.exercises||[]).reduce((s,e)=> s+(e.sets||[]).filter(x=>x.type!=='warmup' && x.weight!=='' && x.reps!=='').length, 0); }
function workoutTotalReps(w){ return (w.exercises||[]).reduce((s,e)=> s+(e.sets||[]).filter(x=>x.type!=='warmup' && x.reps!=='').reduce((a,x)=>a+Number(x.reps||0),0), 0); }
function allExercisesWithHistory(){
  const map={};
  workouts.forEach(w=> (w.exercises||[]).forEach(e=>{
    if(!map[e.exerciseId]) map[e.exerciseId]={id:e.exerciseId, name:e.name};
  }));
  return Object.values(map);
}
function computeStreak(){
  // consecutive scheduled workout days completed, walking back from today, skipping rest days
  let streak=0; let d=new Date();
  for(let i=0;i<400;i++){
    const iso=d.toISOString().slice(0,10);
    const dayName=d.toLocaleDateString('en-US',{weekday:'long'});
    const isRest = plan[dayName] && plan[dayName].isRest;
    const done = workouts.some(w=>w.date===iso);
    if(done){ streak++; }
    else if(isRest){ /* skip, don't break */ }
    else if(iso===todayISO()){ /* today not done yet, don't break streak */ }
    else{ break; }
    d.setDate(d.getDate()-1);
  }
  return streak;
}

function getWeekWorkouts(offsetWeeks){
  const now=new Date();
  const day=(now.getDay()+6)%7; // Mon=0
  const monday=new Date(now); monday.setDate(now.getDate()-day-offsetWeeks*7);
  monday.setHours(0,0,0,0);
  const sunday=new Date(monday); sunday.setDate(monday.getDate()+6); sunday.setHours(23,59,59,999);
  return workouts.filter(w=>{ const d=new Date(w.date+'T12:00:00'); return d>=monday && d<=sunday; });
}

/* ================= START / END WORKOUT ================= */
function startWorkout(dayName){
  const dp=plan[dayName];
  const exercises = dp.exercises.map(e=>{
    const sets=[];
    for(let i=0;i<(e.sets||3);i++) sets.push({type:'working', weight:'', reps:'', rir:''});
    return {exerciseId:e.id, name:e.name, muscleGroup:e.muscleGroup||'', restTime:e.rest||settings.restDefault, notes:'', sets};
  });
  activeWorkout = {
    id: uid(), date: todayISO(), dayName, planName: dp.name||dayName,
    startTime: Date.now(), endTime:null, durationSec:0, notes:'',
    exercises
  };
  expandedExId = exercises.length ? exercises[0].exerciseId : null;
  saveActiveWorkout();
  navigate('workout');
  startWorkoutTicker();
}
let workoutTickInterval=null;

  clearInterval(workoutTickInterval);

      if(el) el.textContent=fmtClock((Date.now()-activeWorkout.startTime)/1000);

}

  const isOpen = expandedExId===ex.exerciseId;

  card.className='ex-track-card'+(isOpen?' open':'');
  const workingDone = ex.sets.filter(s=>s.type!=='warmup' && s.weight!=='' && s.reps!=='').length;

  head.className='ex-track-head';
  head.innerHTML=`<div><div class="ex-track-name">${escapeHtml(ex.name)}</div><div class="ex-track-sub">${workingDone}/${ex.sets.filter(s=>s.type!=='warmup').length} sets logged${ex.muscleGroup?' · '+escapeHtml(ex.muscleGroup):''}</div></div><span class="chevron">▾</span>`;
  head.onclick=()=>{ expandedExId = isOpen? null : ex.exerciseId; render(); };
  card.appendChild(head);

  if(isOpen){
    const body=document.createElement('div');
    body.className='ex-track-body';

    const hist = historyForExercise(ex.exerciseId, activeWorkout.id);
    const last = hist[0];
    const best = bestSetForExercise(ex.exerciseId, activeWorkout.id);
    const prevBox=document.createElement('div');
    prevBox.className='prev-box';
    if(last){
      prevBox.innerHTML=`<div class="pb-label">Last time — ${fmtDateShort(last.date)}</div>
        <div class="prev-chips">${last.sets.map(s=>`<span class="set-chip">${s.weight}${wu()} × ${s.reps}</span>`).join('')}</div>
        ${best?`<div class="pb-label" style="margin-top:10px;">Best</div><div class="prev-chips"><span class="set-chip" style="background:var(--gold-dim); color:var(--gold); border-color:#e8b64c44;">${best.weight}${wu()} × ${best.reps}</span></div>`:''}
        <div class="suggestion-txt">💡 ${suggestionText(last)}</div>`;
    }else{
      prevBox.innerHTML=`<div class="pb-label">First time logging this</div><div style="font-size:0.8rem; color:var(--text-muted);">Log today's sets — this becomes your baseline.</div>`;
    }
    body.appendChild(prevBox);

    const labels=document.createElement('div');
    labels.className='setrow-labels';
    labels.innerHTML=`<span>#</span><span>${wu()}</span><span>reps</span><span style="margin-left:26px;">rir</span>`;
    body.appendChild(labels);

    const setsWrap=document.createElement('div');
    ex.sets.forEach((s,i)=> setsWrap.appendChild(renderSetRow(ex,s,i)));
    body.appendChild(setsWrap);

    const addRow=document.createElement('div');
    addRow.className='add-set-row';
    addRow.innerHTML=`<button class="warmup-btn">+ Warm-up Set</button><button>+ Add Set</button>`;
    addRow.children[0].onclick=()=>{ ex.sets.push({type:'warmup',weight:'',reps:'',rir:''}); saveActiveWorkout(); render(); };
    addRow.children[1].onclick=()=>{ ex.sets.push({type:'working',weight:'',reps:'',rir:''}); saveActiveWorkout(); render(); };
    body.appendChild(addRow);

    const notes=document.createElement('textarea');
    notes.className='ex-notes'; notes.placeholder='Notes for this exercise (seat position, grip, etc.)';
    notes.value=ex.notes||'';
    notes.oninput=(e)=>{ ex.notes=e.target.value; saveActiveWorkout(); };
    body.appendChild(notes);

    card.appendChild(body);
  }
  return card;
}
function suggestionText(last){
  if(!last || !last.sets.length) return 'Log a few sessions to unlock suggestions.';
  const top = last.sets.reduce((a,b)=> (b.reps>a.reps? b:a), last.sets[0]);
  if(top.reps>=12) return `Try adding 2.5${wu()} next time — you hit ${top.reps} reps at ${top.weight}${wu()}.`;
  if(top.reps>=10) return `Close to a jump — aim for 1-2 more reps at ${top.weight}${wu()}, or a small weight bump.`;
  return `Aim to match or beat last time: ${top.weight}${wu()} × ${top.reps}.`;
}

let restTriggered = new Set();
function maybeStartRest(ex,s){
  if(s.weight!=='' && s.reps!=='' && s.weight!=null && s.reps!=null){
    const key = ex.exerciseId+'_'+ex.sets.indexOf(s);
    startRest(ex.restTime||settings.restDefault);
  }
}
function startRest(seconds){
  clearInterval(restTimer.intervalId);
  restTimer.seconds=seconds; restTimer.total=seconds; restTimer.running=true;
  restTimer.intervalId=setInterval(()=>{
    restTimer.seconds--;
    if(restTimer.seconds<=0){
      clearInterval(restTimer.intervalId);
      restTimer.running=false;
      onRestComplete();
    }
    renderRestWidget();
  },1000);
  renderRestWidget();
}
function onRestComplete(){
  if(settings.sound) playBeep();
  if(settings.vibration && navigator.vibrate) navigator.vibrate([200,100,200]);
  showToast('Rest complete 💪');
  renderRestWidget();
}
function playBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(); const g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value=880; g.gain.value=0.15;
    o.start(); o.stop(ctx.currentTime+0.35);
  }catch(e){}
}
function renderRestWidget(){
  const root=document.getElementById('restWidgetRoot');
  if(!restTimer.running && restTimer.seconds<=0){ root.innerHTML=''; return; }
  if(!restTimer.running && restTimer.seconds>0){ root.innerHTML=''; return; }
  root.innerHTML=`
    <div class="rest-widget">
      <div><div class="rw-label">Rest</div><div class="rw-time">${fmtClock(restTimer.seconds)}</div></div>
      <div class="rw-actions">
        <button class="rw-btn" id="rwPlus">+30s</button>
        <button class="rw-btn" id="rwSkip">Skip</button>
      </div>
    </div>`;
  document.getElementById('rwPlus').onclick=()=>{ restTimer.seconds+=30; renderRestWidget(); };
  document.getElementById('rwSkip').onclick=()=>{ clearInterval(restTimer.intervalId); restTimer.running=false; restTimer.seconds=0; renderRestWidget(); };
}

function showSummaryModal(w){
  const prevSameePlan = workouts.filter(x=>x.dayName===w.dayName).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const vol = workoutVolume(w);
  const sets = workoutWorkingSets(w);
  const reps = workoutTotalReps(w);
  let weightPRs=0, repPRs=0;
  const progressLines=[];
  w.exercises.forEach(ex=>{
    const hist = historyForExercise(ex.exerciseId, w.id);
    const prevRow = hist[0];
    const todayWorking = ex.sets.filter(s=>s.type!=='warmup' && s.weight!=='' && s.reps!=='');
    if(!todayWorking.length) return;
    const todayTop = todayWorking.reduce((a,b)=> (Number(b.weight)>Number(a.weight)||(Number(b.weight)===Number(a.weight)&&Number(b.reps)>Number(a.reps)))?b:a, todayWorking[0]);
    if(prevRow && prevRow.sets.length){
      const prevTop = prevRow.sets.reduce((a,b)=> (b.weight>a.weight||(b.weight===a.weight&&b.reps>a.reps))?b:a, prevRow.sets[0]);
      if(Number(todayTop.weight)>prevTop.weight) weightPRs++;
      else if(Number(todayTop.weight)===prevTop.weight && Number(todayTop.reps)>prevTop.reps) repPRs++;
      progressLines.push({name:ex.name, prev:`${prevTop.weight}${wu()} × ${prevTop.reps}`, today:`${todayTop.weight}${wu()} × ${todayTop.reps}`});
    }else{
      progressLines.push({name:ex.name, prev:'—', today:`${todayTop.weight}${wu()} × ${todayTop.reps}`});
    }
  });
  const prevVol = prevSameePlan ? workoutVolume(prevSameePlan) : null;
  const volDiffPct = prevVol!=null && prevVol>0 ? Math.round(((vol-prevVol)/prevVol)*1000)/10 : null;
  const prevSets = prevSameePlan ? workoutWorkingSets(prevSameePlan) : null;
  const prevDur = prevSameePlan ? prevSameePlan.durationSec : null;

  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML=`<div class="modal">
    <div class="summary-hero"><div class="se">🎉</div><h2>Workout Complete</h2><div class="sw">${escapeHtml(w.planName)}</div></div>
    <div class="sum-stat-grid">
      <div class="sum-stat"><div class="sn">${fmtDuration(w.durationSec)}</div><div class="sl">Duration</div></div>
      <div class="sum-stat"><div class="sn">${w.exercises.length}</div><div class="sl">Exercises</div></div>
      <div class="sum-stat"><div class="sn">${sets}</div><div class="sl">Sets</div></div>
      <div class="sum-stat"><div class="sn">${reps}</div><div class="sl">Reps</div></div>
    </div>
    <div class="card" style="background:var(--surface-2); margin-bottom:14px;">
      <div class="card-title">Total Volume</div>
      <div style="font-family:'JetBrains Mono',monospace; font-size:1.3rem; font-weight:700;">${Math.round(vol).toLocaleString()} ${wu()}</div>
    </div>
    ${progressLines.length?`<div class="card-title" style="margin-top:6px;">Today's Progress</div>
    <div class="card" style="background:var(--surface-2);">${progressLines.map(p=>`<div class="progress-line"><span>${escapeHtml(p.name)}</span><span class="mono">${p.prev} <span class="pl-arrow">→</span> ${p.today}</span></div>`).join('')}</div>`:''}
    ${(weightPRs+repPRs)>0?`<div class="card-title" style="margin-top:14px;">Personal Records</div>
    <div class="card" style="background:var(--gold-dim); border-color:#e8b64c44;">
      ${weightPRs>0?`<div class="pr-line">🏆 +${weightPRs} Weight PR${weightPRs>1?'s':''}</div>`:''}
      ${repPRs>0?`<div class="pr-line">🔥 +${repPRs} Rep PR${repPRs>1?'s':''}</div>`:''}
    </div>`:''}
    ${prevSameePlan?`<div class="card-title" style="margin-top:14px;">Compared to Last ${escapeHtml(w.dayName)}</div>
    <div class="card" style="background:var(--surface-2);">
      <div class="compare-row"><span>Volume</span><span class="compare-val ${volDiffPct>=0?'up':'down'}">${volDiffPct>0?'+':''}${volDiffPct}%</span></div>
      <div class="compare-row"><span>Sets</span><span class="compare-val ${sets>=prevSets?'up':'down'}">${sets-prevSets===0?'Same':(sets-prevSets>0?'+':'')+(sets-prevSets)}</span></div>
      <div class="compare-row"><span>Duration</span><span class="compare-val ${w.durationSec<=prevDur?'up':'down'}">${w.durationSec-prevDur===0?'Same':(w.durationSec>prevDur?'+':'')+Math.round((w.durationSec-prevDur)/60)+'m'}</span></div>
    </div>`:''}
    <div class="form-group section-sp">
      <label class="form-label">Notes</label>
      <textarea class="ex-notes" id="finalNotes">${escapeHtml(w.notes)}</textarea>
    </div>
    <button class="btn btn-primary btn-full" id="saveWorkoutBtn">Save Workout</button>
  </div>`;
  document.getElementById('modalRoot').appendChild(overlay);
  document.getElementById('saveWorkoutBtn').onclick=async ()=>{
    w.notes = document.getElementById('finalNotes').value;
    workouts.push(w);
    await saveWorkouts();
    activeWorkout=null;
    await saveActiveWorkout();
    overlay.remove();
    showToast('Workout saved 💪');
    navigate('dashboard');
  };
}

  chartCard.appendChild(chartWrap);

  // history table
  const histLbl=document.createElement('div'); histLbl.className='card-title section-sp'; histLbl.textContent='Session History';
  chartCard.appendChild(histLbl);
  historyForExercise(progressSelectedExercise, null).forEach(row=>{
    const r=document.createElement('div'); r.className='history-item'; r.style.padding='10px 12px';
    r.innerHTML=`<div class="hi-date" style="font-size:0.82rem;">${fmtDateShort(row.date)}</div><div class="prev-chips">${row.sets.map(s=>`<span class="set-chip">${s.weight}${wu()}×${s.reps}</span>`).join('')}</div>`;
    chartCard.appendChild(r);
  });

  app.appendChild(chartCard);
}
function filterByRange(rows, range){
  if(range==='all') return rows;
  const days = {'7d':7,'30d':30,'3m':90,'6m':180}[range];
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-days);
  return rows.filter(r=> new Date(r.date+'T00:00:00') >= cutoff);
}
function buildLineChart(points){
  const w=560,h=160,pad=28;
  const vals=points.map(p=>p.value);
  const min=Math.min(...vals), max=Math.max(...vals);
  const range = (max-min)||1;
  const stepX = points.length>1 ? (w-pad*2)/(points.length-1) : 0;
  const coords = points.map((p,i)=>{
    const x = pad + i*stepX;
    const y = h-pad - ((p.value-min)/range)*(h-pad*2);
    return [x,y];
  });
  const pathD = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const svgNS='http://www.w3.org/2000/svg';
  const container=document.createElement('div');
  container.innerHTML=`<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block;">
    <polyline points="${coords.map(c=>c.join(',')).join(' ')}" fill="none" stroke="#ff5a2e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${coords.map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="3.5" fill="#ff5a2e"/>`).join('')}
  </svg>
  <div style="display:flex; justify-content:space-between; font-size:0.65rem; color:var(--text-dim); margin-top:4px;">
    <span>${fmtDateShort(points[0].date)}</span><span>${fmtDateShort(points[points.length-1].date)}</span>
  </div>
  <div style="text-align:center; font-family:'JetBrains Mono',monospace; font-size:0.78rem; color:var(--text-muted); margin-top:4px;">Peak: ${max}${wu()} · Start: ${points[0].value}${wu()}</div>`;
  return container;
}

/* ================= HISTORY ================= */
function renderHistory(app){
  const search=document.createElement('input');
  search.className='search-input'; search.placeholder='Search by exercise or date...';
  search.value=historySearch;
  search.oninput=(e)=>{ historySearch=e.target.value; renderHistoryList(); };
  app.appendChild(search);

  const calCard=document.createElement('div');
  calCard.className='card';
  calCard.appendChild(buildCalendar());
  app.appendChild(calCard);

  const listWrap=document.createElement('div');
  listWrap.id='historyListWrap';
  app.appendChild(listWrap);
  renderHistoryList();

  function renderHistoryList(){
    listWrap.innerHTML='';
    const q=historySearch.trim().toLowerCase();
    const filtered = pastWorkoutsSorted().filter(w=>{
      if(!q) return true;
      if(w.date.includes(q) || (w.planName||'').toLowerCase().includes(q)) return true;
      return (w.exercises||[]).some(e=>e.name.toLowerCase().includes(q));
    });
    if(filtered.length===0){
      listWrap.innerHTML=`<div class="empty-state"><div class="plate-icon"></div><p>No workouts found.</p></div>`;
      return;
    }
    filtered.forEach(w=>{
      const item=document.createElement('div');
      item.className='history-item';
      item.innerHTML=`<div><div class="hi-date">${fmtDateShort(w.date)}</div><div class="hi-plan">${escapeHtml(w.planName)}</div></div>
        <div class="hi-stats">${workoutWorkingSets(w)} sets<br>${Math.round(workoutVolume(w)).toLocaleString()} ${wu()}</div>`;
      item.onclick=()=>openWorkoutDetail(w);
      listWrap.appendChild(item);
    });
  }
}
function buildCalendar(){
  const wrap=document.createElement('div');
  const now=new Date();
  const viewDate=new Date(now.getFullYear(), now.getMonth()+calMonthOffset, 1);
  const monthLabel=viewDate.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const nav=document.createElement('div'); nav.className='cal-nav';
  nav.innerHTML=`<button class="icon-btn">‹</button><div class="cal-month">${monthLabel}</div><button class="icon-btn">›</button>`;
  nav.children[0].onclick=()=>{ calMonthOffset--; render(); };
  nav.children[2].onclick=()=>{ calMonthOffset=Math.min(0,calMonthOffset+1); render(); };
  wrap.appendChild(nav);

  const grid=document.createElement('div'); grid.className='cal-grid';
  ['M','T','W','T','F','S','S'].forEach(d=>{
    const el=document.createElement('div'); el.className='cal-dow'; el.textContent=d; grid.appendChild(el);
  });
  const firstDay = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
  const startOffset = (firstDay.getDay()+6)%7; // Monday=0
  for(let i=0;i<startOffset;i++){ const b=document.createElement('div'); b.className='cal-cell blank'; grid.appendChild(b); }
  const daysInMonth = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 0).getDate();
  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(viewDate.getFullYear(), viewDate.getMonth(), d);
    const iso = dateObj.toISOString().slice(0,10);
    const dayName = dateObj.toLocaleDateString('en-US',{weekday:'long'});
    const done = workouts.some(w=>w.date===iso);
    const isRestDay = plan[dayName] && plan[dayName].isRest;
    const isFuture = dateObj > now;
    const cell=document.createElement('div');
    cell.className='cal-cell'+(done?' done':(isRestDay?' rest-d':''))+(isFuture?' future':'');
    cell.textContent=d;
    if(done){ cell.onclick=()=>{ const w=workouts.find(x=>x.date===iso); if(w) openWorkoutDetail(w); }; cell.style.cursor='pointer'; }
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
  return wrap;
}
function openWorkoutDetail(w){
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  const vol=workoutVolume(w);
  overlay.innerHTML=`<div class="modal">
    <div class="modal-head"><div class="modal-title">${escapeHtml(w.planName)}</div><button class="modal-close">✕</button></div>
    <div style="color:var(--text-muted); font-size:0.82rem; margin-bottom:14px;">${fmtDateFull(w.date)} · ${w.durationSec?fmtDuration(w.durationSec):'—'}</div>
    <div class="sum-stat-grid">
      <div class="sum-stat"><div class="sn">${w.exercises.length}</div><div class="sl">Exercises</div></div>
      <div class="sum-stat"><div class="sn">${workoutWorkingSets(w)}</div><div class="sl">Sets</div></div>
      <div class="sum-stat"><div class="sn">${workoutTotalReps(w)}</div><div class="sl">Reps</div></div>
      <div class="sum-stat"><div class="sn">${Math.round(vol).toLocaleString()}</div><div class="sl">Volume</div></div>
    </div>
    <div id="detailExList"></div>
    ${w.notes?`<div class="card-title section-sp">Notes</div><div class="card" style="background:var(--surface-2);">${escapeHtml(w.notes)}</div>`:''}
    <div class="confirm-actions">
      <button class="btn btn-ghost btn-block" id="editWorkoutBtn">Edit</button>
      <button class="btn btn-danger btn-block" id="delWorkoutBtn">Delete</button>
    </div>
  </div>`;
  document.getElementById('modalRoot').appendChild(overlay);
  overlay.querySelector('.modal-close').onclick=()=>overlay.remove();
  overlay.onclick=(ev)=>{ if(ev.target===overlay) overlay.remove(); };
  const listEl=overlay.querySelector('#detailExList');
  w.exercises.forEach(ex=>{
    const working=ex.sets.filter(s=>s.type!=='warmup');
    const div=document.createElement('div'); div.className='card'; div.style.background='var(--surface-2)'; div.style.marginTop='10px';
    div.innerHTML=`<div style="font-family:'Oswald',sans-serif; font-size:0.9rem; margin-bottom:6px;">${escapeHtml(ex.name)}</div>
      <div class="prev-chips">${working.map(s=>`<span class="set-chip">${s.weight}${wu()} × ${s.reps}${s.rir!==''&&s.rir!=null?' · RIR '+s.rir:''}</span>`).join('')||'<span style="color:var(--text-dim); font-size:0.78rem;">No sets logged</span>'}</div>`;
    listEl.appendChild(div);
  });
  overlay.querySelector('#delWorkoutBtn').onclick=()=>{
    if(confirm('Are you sure you want to delete this workout? This cannot be undone.')){
      workouts = workouts.filter(x=>x.id!==w.id);
      saveWorkouts(); overlay.remove(); showToast('Workout deleted'); render();
    }
  };
  overlay.querySelector('#editWorkoutBtn').onclick=()=>{
    overlay.remove();
    openEditWorkout(w);
  };
}
function openEditWorkout(w){
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  const modal=document.createElement('div'); modal.className='modal';
  modal.innerHTML=`<div class="modal-head"><div class="modal-title">Edit Workout</div><button class="modal-close">✕</button></div>
    <div id="editExList"></div>
    <div class="form-group section-sp"><label class="form-label">Notes</label><textarea class="ex-notes" id="editNotes">${escapeHtml(w.notes||'')}</textarea></div>
    <button class="btn btn-primary btn-full" id="saveEditBtn">Save Changes</button>`;
  overlay.appendChild(modal);
  document.getElementById('modalRoot').appendChild(overlay);
  overlay.querySelector('.modal-close').onclick=()=>overlay.remove();
  const listEl=modal.querySelector('#editExList');
  w.exercises.forEach(ex=>{
    const card=document.createElement('div'); card.className='card'; card.style.background='var(--surface-2)'; card.style.marginTop='10px';
    card.innerHTML=`<div style="font-family:'Oswald',sans-serif; font-size:0.9rem; margin-bottom:8px;">${escapeHtml(ex.name)}</div>`;
    ex.sets.forEach((s,i)=>{
      const row=document.createElement('div'); row.className='set-row';
      row.innerHTML=`<span class="set-tag ${s.type==='warmup'?'warm':''}">${s.type==='warmup'?'W':i+1}</span>
        <input type="number" step="0.5" value="${s.weight}">
        <input type="number" step="1" value="${s.reps}">
        <button class="rm">✕</button>`;
      const [wi,ri]=row.querySelectorAll('input');
      wi.oninput=(e)=>{ s.weight=e.target.value===''?'':Number(e.target.value); };
      ri.oninput=(e)=>{ s.reps=e.target.value===''?'':Number(e.target.value); };
      row.querySelector('.rm').onclick=()=>{ ex.sets.splice(i,1); saveWorkouts(); overlay.remove(); openEditWorkout(w); };
      card.appendChild(row);
    });
    listEl.appendChild(card);
  });
  modal.querySelector('#saveEditBtn').onclick=async ()=>{
    w.notes=document.getElementById('editNotes').value;
    await saveWorkouts();
    overlay.remove(); showToast('Workout updated'); render();
  };
}

/* ================= SETTINGS ================= */
function renderSettings(app){
  const card=document.createElement('div');
  card.className='card';
  card.innerHTML=`<div class="card-title">Profile</div>
    <div class="form-group"><label class="form-label">Name</label><input class="form-input" id="setName" value="${escapeHtml(settings.name)}"></div>
    <div class="form-group"><label class="form-label">Weight Unit</label>
      <select class="form-input" id="setUnit">
        <option value="kg" ${settings.weightUnit==='kg'?'selected':''}>Kilograms (kg)</option>
        <option value="lb" ${settings.weightUnit==='lb'?'selected':''}>Pounds (lb)</option>
      </select>
    </div>
    <div class="form-group"><label class="form-label">Default Rest Timer</label>
      <select class="form-input" id="setRest">
        ${[30,60,90,120,180].map(v=>`<option value="${v}" ${settings.restDefault==v?'selected':''}>${v}s</option>`).join('')}
      </select>
    </div>
    <div class="toggle-row"><span style="font-size:0.88rem;">Rest timer sound</span><label class="switch"><input type="checkbox" id="setSound" ${settings.sound?'checked':''}><span class="slider"></span></label></div>
    <div class="toggle-row"><span style="font-size:0.88rem;">Vibration</span><label class="switch"><input type="checkbox" id="setVibe" ${settings.vibration?'checked':''}><span class="slider"></span></label></div>
    <button class="btn btn-primary btn-full" id="saveSettingsBtn" style="margin-top:8px;">Save</button>`;
  app.appendChild(card);
  card.querySelector('#saveSettingsBtn').onclick=()=>{
    settings.name=document.getElementById('setName').value.trim();
    settings.weightUnit=document.getElementById('setUnit').value;
    settings.restDefault=Number(document.getElementById('setRest').value);
    settings.sound=document.getElementById('setSound').checked;
    settings.vibration=document.getElementById('setVibe').checked;
    saveSettings(); showToast('Settings saved');
  };

  // Bodyweight
  const bwCard=document.createElement('div');
  bwCard.className='card';
  bwCard.innerHTML=`<div class="card-title">Body Weight</div>
    <div class="form-row">
      <input class="form-input" type="number" step="0.1" id="bwInput" placeholder="Today's weight (${wu()})">
      <button class="btn btn-steel" id="bwAdd" style="flex:0 0 auto;">Log</button>
    </div>`;
  app.appendChild(bwCard);
  bwCard.querySelector('#bwAdd').onclick=()=>{
    const v=Number(document.getElementById('bwInput').value);
    if(!v) return;
    bodymetrics.bodyweight = bodymetrics.bodyweight.filter(e=>e.date!==todayISO());
    bodymetrics.bodyweight.push({date:todayISO(), weight:v});
    bodymetrics.bodyweight.sort((a,b)=>a.date.localeCompare(b.date));
    saveBodymetrics(); render();
  };
  if(bodymetrics.bodyweight.length){
    const chart=buildLineChart(bodymetrics.bodyweight.slice(-30).map(e=>({date:e.date,value:e.weight})));
    const cw=document.createElement('div'); cw.className='chart-wrap'; cw.appendChild(chart);
    bwCard.appendChild(cw);
    const recent=document.createElement('div'); recent.style.marginTop='10px';
    bodymetrics.bodyweight.slice(-5).reverse().forEach(e=>{
      const r=document.createElement('div'); r.className='link-row';
      r.innerHTML=`<span>${fmtDateShort(e.date)}</span><span class="mono">${e.weight} ${wu()}</span>`;
      recent.appendChild(r);
    });
    bwCard.appendChild(recent);
  }

  // Measurements
  const mCard=document.createElement('div');
  mCard.className='card';
  mCard.innerHTML=`<div class="card-title">Body Measurements</div>
    <div class="form-row"><input class="form-input" placeholder="Chest" id="mChest" type="number"><input class="form-input" placeholder="Waist" id="mWaist" type="number"></div>
    <div class="form-row" style="margin-top:10px;"><input class="form-input" placeholder="Arms" id="mArms" type="number"><input class="form-input" placeholder="Thighs" id="mThighs" type="number"></div>
    <button class="btn btn-steel btn-block" id="mAdd" style="margin-top:10px;">Log Measurements</button>`;
  app.appendChild(mCard);
  mCard.querySelector('#mAdd').onclick=()=>{
    const rec={date:todayISO(), chest:document.getElementById('mChest').value, waist:document.getElementById('mWaist').value, arms:document.getElementById('mArms').value, thighs:document.getElementById('mThighs').value};
    bodymetrics.measurements.push(rec);
    saveBodymetrics(); showToast('Measurements logged'); render();
  };
  if(bodymetrics.measurements.length){
    const recent=document.createElement('div'); recent.style.marginTop='10px';
    bodymetrics.measurements.slice(-3).reverse().forEach(e=>{
      const r=document.createElement('div'); r.className='link-row';
      r.innerHTML=`<span>${fmtDateShort(e.date)}</span><span class="mono" style="font-size:0.72rem;">C:${e.chest||'-'} W:${e.waist||'-'} A:${e.arms||'-'} T:${e.thighs||'-'}</span>`;
      recent.appendChild(r);
    });
    mCard.appendChild(recent);
  }

  // Cloud Sync
  const syncCard=document.createElement('div');
  syncCard.className='card';
  const statusColor = syncConnected ? (syncStatus==='error'?'var(--danger)':'var(--good)') : 'var(--text-muted)';
  const statusText = syncConnected ? (syncStatus==='error'?'Sync error':'Connected · synced') : 'Not connected';
  syncCard.innerHTML=`<div class="card-title">Cloud Sync <span style="color:${statusColor}; font-size:0.68rem; text-transform:none; letter-spacing:0;">● ${statusText}</span></div>
    <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:12px;">Sync your data across your phone and laptop using a free Firebase project. See setup steps below.</p>`;
  if(!syncConnected){
    syncCard.innerHTML+=`
      <div class="form-group"><label class="form-label">Firebase Config (paste JSON)</label><textarea class="ex-notes" id="syncConfigInput" placeholder='{"apiKey":"...","projectId":"...", ...}' style="min-height:80px;"></textarea></div>
      <div class="form-group"><label class="form-label">Sync Code (pick any code, use same on all devices)</label><input class="form-input" id="syncCodeInput" placeholder="e.g. vinit-gym-2026"></div>
      <button class="btn btn-steel btn-full" id="syncConnectBtn">Connect & Sync</button>`;
  }else{
    syncCard.innerHTML+=`

        <button class="btn btn-danger btn-block" id="syncDisconnectBtn">Disconnect</button>
      </div>`;
  }
  app.appendChild(syncCard);
  if(!syncConnected){
    syncCard.querySelector('#syncConnectBtn').onclick=async ()=>{
      const raw=document.getElementById('syncConfigInput').value.trim();
      const code=document.getElementById('syncCodeInput').value.trim();
      if(!raw||!code){ showToast('Fill in both fields'); return; }
      let cfg;
      try{ cfg=JSON.parse(raw); }catch(e){ showToast('Config is not valid JSON'); return; }
      showToast('Connecting...');
      const r = await connectSync(cfg, code);
      if(r.ok){ showToast('Connected! Synced.'); render(); }
      else{ showToast(r.msg || 'Connection failed'); }
    };
  }else{
    syncCard.querySelector('#syncNowBtn').onclick=async ()=>{
      showToast('Syncing...');

      const r = await pullCloudNow();
      showToast(r.ok ? 'Synced' : (r.msg||'Sync failed'));
      render();
    };
    syncCard.querySelector('#syncDisconnectBtn').onclick=()=>{

  // Data
  const dataCard=document.createElement('div');
  dataCard.className='card';

  app.appendChild(dataCard);
  dataCard.querySelector('#exportBtn').onclick=exportCSV;
  dataCard.querySelector('#clearBtn').onclick=()=>{
    if(confirm('This deletes your entire plan, workout history, and settings permanently. Continue?')){
      if(confirm('Really sure? This cannot be undone.')){
        clearAllData();
      }
    }
  };
}
function exportCSV(){
  let rows=[['date','day','exercise','set_number','type','weight','reps','rir']];
  pastWorkoutsSorted().forEach(w=>{
    w.exercises.forEach(ex=>{
      ex.sets.forEach((s,i)=>{
        rows.push([w.date, w.dayName, ex.name, i+1, s.type, s.weight, s.reps, s.rir]);
      });
    });
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',')).join('\n');
  try{
    const blob=new Blob([csv],{type:'text/csv'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='gym-tracker-history.csv';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast('CSV downloaded');
  }catch(e){
    showToast('Export failed in this environment');
  }
}
async function clearAllData(){
  settings={name:'', weightUnit:'kg', restDefault:90, sound:true, vibration:true, setupDone:false};
  plan={}; DAYS.forEach(d=>plan[d]={name:'',isRest:false,exercises:[]});
  workouts=[]; activeWorkout=null; bodymetrics={bodyweight:[],measurements:[]};
  await Promise.all([saveSettings(), savePlan(), saveWorkouts(), saveActiveWorkout(), saveBodymetrics()]);
  view='onboarding';
  render();
}
