<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>GYM Workout Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{
  --bg:#101215; --surface:#1b1e23; --surface-2:#22262c; --surface-3:#282d34;
  --border:#2c3038; --text:#f0eee9; --text-muted:#8b929c; --text-dim:#5c626c;
  --accent:#ff5a2e; --accent-dim:#ff5a2e26; --accent-text:#17130f;
  --steel:#4fc3dc; --steel-dim:#4fc3dc22;
  --good:#4caf7d; --good-dim:#4caf7d22;
  --danger:#e05c5c; --danger-dim:#e05c5c22;
  --gold:#e8b64c; --gold-dim:#e8b64c22;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
  min-height:100vh; padding-bottom:100px; overflow-x:hidden;
}
::selection{background:var(--accent-dim);}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; color:var(--text);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--steel); outline-offset:0;}
h1,h2,h3{font-family:'Oswald',sans-serif; text-transform:uppercase;}
.mono{font-family:'JetBrains Mono',monospace;}

/* Header */
.app-header{
  position:sticky; top:0; z-index:40;
  background:rgba(16,18,21,0.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
  padding:calc(14px + env(safe-area-inset-top, 0px)) 16px 14px; display:flex; align-items:center; justify-content:space-between;
}
.brand{font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:2px; font-size:1.25rem;}
.brand span{color:var(--accent);}
.header-right{display:flex; align-items:center; gap:10px;}
.streak-chip{
  display:flex; align-items:center; gap:5px;
  background:var(--surface); border:1px solid var(--border);
  padding:6px 10px; border-radius:20px; font-size:0.78rem; color:var(--text-muted);
  font-family:'JetBrains Mono',monospace;
}
.streak-chip.active{color:var(--accent); border-color:#ff5a2e44;}
.gear-btn{
  background:var(--surface); border:1px solid var(--border); color:var(--text-muted);
  width:36px; height:36px; border-radius:8px; font-size:1rem; display:flex; align-items:center; justify-content:center;
}

.container{max-width:640px; margin:0 auto; padding:16px;}

/* Cards */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:16px; margin-bottom:14px;
}
.card-title{
  font-size:0.72rem; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-muted);
  margin-bottom:10px; display:flex; align-items:center; justify-content:space-between;
}

/* Buttons */
.btn{
  border:none; border-radius:9px; padding:13px 18px; font-family:'Oswald',sans-serif;
  font-weight:600; letter-spacing:0.5px; text-transform:uppercase; font-size:0.85rem;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  transition:transform 0.1s ease;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--accent); color:var(--accent-text); width:100%;}
.btn-steel{background:var(--steel); color:#0d1a1d;}
.btn-ghost{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
.btn-danger{background:var(--danger-dim); color:var(--danger); border:1px solid #e05c5c44;}
.btn-sm{padding:8px 12px; font-size:0.72rem; border-radius:7px;}
.btn-block{width:100%;}
.btn-full{width:100%; padding:16px; font-size:0.95rem;}
.btn:disabled{opacity:0.4; pointer-events:none;}
.icon-btn{background:none; border:none; color:var(--text-muted); font-size:1.05rem; padding:4px; line-height:1;}
.icon-btn:hover{color:var(--text);}
.icon-btn.danger:hover{color:var(--danger);}

/* Dashboard */
.glass-card{
  background:rgba(27,30,35,0.62);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,0.07);
  box-shadow:0 8px 24px rgba(0,0,0,0.25);
}
.quote-card{
  border-radius:14px; padding:16px 18px; margin-bottom:16px;
  border-left:3px solid var(--accent);
}
.quote-text{font-size:0.92rem; font-style:italic; color:var(--text); line-height:1.5;}
.quote-attr{font-size:0.68rem; color:var(--text-muted); margin-top:6px; text-transform:uppercase; letter-spacing:1px;}
.insight-card{border-radius:14px; padding:16px 18px; margin-bottom:14px; border-left:3px solid var(--steel);}
.insight-status{font-family:'Oswald',sans-serif; font-size:0.9rem; letter-spacing:0.5px; margin-bottom:5px;}
.insight-msg{font-size:0.82rem; color:var(--text-muted); line-height:1.45;}
.today-hero{
  background:linear-gradient(145deg, rgba(27,30,35,0.7) 0%, rgba(34,38,44,0.7) 100%);
  border:1px solid rgba(255,255,255,0.07); border-radius:16px; padding:24px 20px; margin-bottom:16px;
  text-align:center; position:relative; overflow:hidden;
}
.today-hero::before{
  content:""; position:absolute; top:-40%; right:-20%; width:220px; height:220px;
  background:radial-gradient(circle, var(--accent-dim) 0%, transparent 70%);
}
.today-label{color:var(--text-muted); font-size:0.75rem; letter-spacing:2px; text-transform:uppercase;}
.today-daynum{font-family:'Oswald',sans-serif; font-size:1.1rem; letter-spacing:2px; margin-top:4px; color:var(--text-muted);}
.today-workout-name{font-family:'Oswald',sans-serif; font-size:2.2rem; font-weight:700; letter-spacing:1px; margin:8px 0 18px; text-transform:uppercase;}
.today-workout-name.rest{color:var(--text-muted);}

.week-list{display:flex; flex-direction:column; gap:6px;}
.week-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:11px 14px; border-radius:9px; background:var(--surface-2); border:1px solid transparent;
}
.week-row.today{border-color:var(--accent); background:var(--accent-dim);}
.week-row .wd{font-family:'Oswald',sans-serif; font-size:0.78rem; letter-spacing:1px; color:var(--text-muted); width:44px;}
.week-row.today .wd{color:var(--accent);}
.week-row .wn{flex:1; font-size:0.88rem; padding-left:8px;}
.week-row .wn.rest{color:var(--text-dim); font-style:italic;}

.stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.stat-box{background:var(--surface-2); border-radius:9px; padding:12px 8px; text-align:center;}
.stat-num{font-family:'JetBrains Mono',monospace; font-size:1.15rem; font-weight:700; color:var(--text);}
.stat-lbl{font-size:0.65rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-top:2px;}

.resume-banner{
  background:var(--accent-dim); border:1px solid #ff5a2e55; border-radius:12px;
  padding:14px 16px; margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.resume-banner .rtxt{font-size:0.85rem;}
.resume-banner .rtime{font-family:'JetBrains Mono',monospace; color:var(--accent); font-weight:700;}

/* Bottom nav */
.bottom-nav{
  position:fixed; left:14px; right:14px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:40;
  background:rgba(22,24,28,0.72); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.09); border-radius:26px;
  display:flex; padding:7px 6px; gap:2px;
  box-shadow:0 12px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
  transition:transform 0.38s cubic-bezier(.32,.72,0,1), opacity 0.3s ease;
}
.bottom-nav.nav-hidden{ transform:translateY(150%); opacity:0; pointer-events:none; }
.nav-item{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  background:none; border:none; color:var(--text-dim); padding:8px 2px; border-radius:18px; font-size:0.6rem;
  text-transform:uppercase; letter-spacing:0.4px; font-family:'Oswald',sans-serif;
  transition:background 0.25s ease, color 0.25s ease;
}
.nav-item .ni-icon{font-size:1.1rem;}
.nav-item.active{color:var(--accent); background:rgba(255,90,46,0.14);}

.more-row{
  width:100%; display:flex; align-items:center; gap:14px; padding:14px 10px;
  background:none; border:none; text-align:left; color:var(--text);
}
.more-row-icon{font-size:1.3rem; width:32px; text-align:center;}
.more-row-txt{flex:1; display:flex; flex-direction:column; gap:2px;}
.more-row-lbl{font-family:'Oswald',sans-serif; font-size:0.92rem;}
.more-row-sub{font-size:0.72rem; color:var(--text-muted);}
.more-row-chev{color:var(--text-dim); font-size:1.2rem;}
.more-row-divider{height:1px; background:var(--border); margin:0 10px;}

/* Day tabs (plan editor) */
.day-tabs{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 14px; scrollbar-width:none;}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tab{
  flex:0 0 auto; background:var(--surface); border:1px solid var(--border); color:var(--text-muted);
  font-family:'Oswald',sans-serif; letter-spacing:1px; text-transform:uppercase; font-size:0.78rem;
  padding:9px 14px; border-radius:8px;
}
.day-tab.active{background:var(--accent); border-color:var(--accent); color:var(--accent-text); font-weight:600;}
.day-tab.rest-marked{opacity:0.55;}

.form-group{margin-bottom:14px;}
.form-label{font-size:0.72rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; display:block;}
.form-input{
  width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  padding:11px 13px; border-radius:8px; font-size:0.9rem;
}
.form-row{display:flex; gap:10px;}
.form-row > *{flex:1;}
.toggle-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0;}
.switch{position:relative; width:44px; height:24px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.slider{position:absolute; inset:0; background:var(--surface-3); border-radius:20px; transition:0.2s; border:1px solid var(--border);}
.slider::before{content:""; position:absolute; width:18px; height:18px; left:2px; top:2px; background:var(--text-muted); border-radius:50%; transition:0.2s;}
.switch input:checked + .slider{background:var(--accent-dim); border-color:var(--accent);}
.switch input:checked + .slider::before{transform:translateX(20px); background:var(--accent);}

.plan-ex-card{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:9px;}
.plan-ex-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
.plan-ex-name{font-family:'Oswald',sans-serif; font-size:0.95rem; letter-spacing:0.3px;}
.ss-badge{display:inline-block; background:var(--gold-dim); color:var(--gold); font-size:0.68rem; font-weight:700; padding:2px 6px; border-radius:5px; margin-right:6px; vertical-align:middle;}
.superset-wrap{border-left:3px solid var(--gold); border-radius:4px; padding-left:10px; margin-bottom:12px;}
.superset-hdr{font-family:'Oswald',sans-serif; font-size:0.75rem; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold); margin-bottom:8px; display:flex; align-items:center; gap:6px;}
.plan-ex-muscle{font-size:0.68rem; color:var(--steel); text-transform:uppercase; letter-spacing:0.5px; margin-top:2px;}
.plan-ex-meta{display:flex; gap:12px; margin-top:8px; font-size:0.72rem; color:var(--text-muted); font-family:'JetBrains Mono',monospace; flex-wrap:wrap;}
.plan-ex-actions{display:flex; gap:2px; flex-shrink:0;}

.empty-state{text-align:center; padding:48px 20px; color:var(--text-muted);}
.plate-icon{width:64px; height:64px; margin:0 auto 14px; border-radius:50%; border:6px solid var(--border); position:relative;}
.plate-icon::before{content:""; position:absolute; inset:13px; border-radius:50%; border:3px solid var(--border);}
.empty-state p{font-size:0.88rem; max-width:280px; margin:0 auto;}

/* Modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(8,9,11,0.75); backdrop-filter:blur(3px);
  z-index:100; display:flex; align-items:flex-end; justify-content:center;
}
.modal-overlay.center{align-items:center; padding:16px;}
.modal{
  background:var(--surface); border:1px solid var(--border); border-radius:18px 18px 0 0;
  width:100%; max-width:640px; max-height:88vh; overflow-y:auto; padding:20px;
}
.modal-overlay.center .modal{border-radius:16px; max-height:85vh;}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-title{font-family:'Oswald',sans-serif; font-size:1.1rem; letter-spacing:1px; text-transform:uppercase;}
.modal-close{background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted); width:32px; height:32px; border-radius:8px; font-size:1rem;}

/* Exercise picker */
.search-input{
  width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  padding:11px 13px; border-radius:9px; font-size:0.9rem; margin-bottom:14px;
}
.lib-cat{font-family:'Oswald',sans-serif; font-size:0.72rem; letter-spacing:1.5px; color:var(--text-muted); text-transform:uppercase; margin:14px 0 8px;}
.lib-item{
  display:flex; align-items:center; justify-content:space-between;
  padding:11px 4px; border-bottom:1px solid var(--border); font-size:0.9rem;
}
.lib-item button{background:var(--steel-dim); color:var(--steel); border:1px solid #4fc3dc44; border-radius:6px; padding:5px 12px; font-size:0.72rem; font-family:'Oswald',sans-serif; text-transform:uppercase;}

/* Workout screen */
.workout-topbar{
  position:sticky; top:57px; z-index:30; background:var(--bg); padding:10px 16px 14px;
  border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;
}
.wt-info .wt-name{font-family:'Oswald',sans-serif; font-size:1.1rem; letter-spacing:0.5px; text-transform:uppercase;}
.wt-info .wt-timer{font-family:'JetBrains Mono',monospace; color:var(--accent); font-size:0.85rem; margin-top:2px;}

.ex-track-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:12px; overflow:hidden;}
.ex-track-head{padding:14px 16px; display:flex; align-items:center; justify-content:space-between; cursor:pointer;}
.ex-track-name{font-family:'Oswald',sans-serif; font-size:1rem; letter-spacing:0.3px; text-transform:uppercase;}
.ex-track-sub{font-size:0.72rem; color:var(--text-muted); margin-top:2px;}
.ex-track-body{display:none; padding:0 16px 16px; border-top:1px solid var(--border);}
.ex-track-card.open .ex-track-body{display:block;}
.ex-track-card.open .chevron{transform:rotate(180deg);}
.chevron{color:var(--text-muted); transition:transform 0.2s; font-size:0.75rem;}

.prev-box{background:var(--surface-2); border-radius:9px; padding:12px 14px; margin-top:12px;}
.prev-box .pb-label{font-size:0.68rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;}
.prev-chips{display:flex; flex-wrap:wrap; gap:5px;}
.set-chip{background:var(--steel-dim); border:1px solid #4fc3dc44; color:var(--steel); font-family:'JetBrains Mono',monospace; font-size:0.72rem; padding:3px 8px; border-radius:5px;}
.suggestion-txt{font-size:0.78rem; color:var(--gold); margin-top:8px; display:flex; align-items:center; gap:5px;}

.set-row{display:flex; align-items:center; gap:6px; margin-top:9px;}
.set-tag{width:22px; text-align:center; font-family:'JetBrains Mono',monospace; font-size:0.68rem; color:var(--text-dim);}
.set-tag.warm{color:var(--steel);}
.set-row input{background:var(--surface-2); border:1px solid var(--border); padding:10px; border-radius:7px; width:64px; font-family:'JetBrains Mono',monospace; font-size:0.88rem; text-align:center;}
.set-row select{background:var(--surface-2); border:1px solid var(--border); padding:10px 4px; border-radius:7px; font-size:0.78rem; width:56px;}
.set-row .u{font-size:0.68rem; color:var(--text-muted);}
.set-row .rm{background:none; border:none; color:var(--text-dim); margin-left:auto; font-size:1rem;}
.setrow-labels{display:flex; gap:6px; margin-top:12px; font-size:0.62rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px;}
.setrow-labels span:nth-child(1){width:22px;}
.setrow-labels span:nth-child(2){width:64px; text-align:center;}
.setrow-labels span:nth-child(3){width:64px; text-align:center; margin-left:26px;}

.add-set-row{display:flex; gap:8px; margin-top:12px;}
.add-set-row button{flex:1; background:transparent; border:1px dashed var(--border); color:var(--steel); padding:12px; border-radius:9px; font-size:0.75rem; font-family:'Oswald',sans-serif; text-transform:uppercase; min-height:44px;}
.add-set-row button.warmup-btn{color:var(--text-muted);}

/* Mobile stepper set card (active workout logging) */
.set-card{background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:14px; margin-top:10px;}
.set-card.done{border-color:#4caf7d55; background:linear-gradient(0deg, var(--good-dim) 0%, var(--surface-2) 55%);}
.set-card-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.set-card-tag{font-family:'Oswald',sans-serif; font-size:0.85rem; letter-spacing:0.5px; color:var(--text-muted); display:flex; align-items:center; gap:6px;}
.set-card-tag.warm{color:var(--steel);}
.set-card-done-badge{color:var(--good); font-size:0.72rem; font-family:'Oswald',sans-serif; letter-spacing:0.5px; display:none;}
.set-card.done .set-card-done-badge{display:inline;}
.stepper-group{display:flex; gap:10px; flex-wrap:wrap;}
.stepper-block{flex:1 1 130px; min-width:130px;}
@media (max-width:340px){
  .stepper-block{flex:1 1 100%;}
}
.stepper-lbl{font-size:0.62rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:5px; text-align:center;}
.stepper-row{display:flex; align-items:center; gap:0; background:var(--surface-3); border-radius:10px; overflow:hidden; border:1px solid var(--border);}
.stepper-btn{
  background:var(--surface-3); border:none; color:var(--text); font-size:1.3rem; font-weight:700;
  width:44px; height:44px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-family:'Oswald',sans-serif; touch-action:manipulation;
}
.stepper-btn:active{background:var(--accent-dim); color:var(--accent);}
.stepper-input{
  flex:1; min-width:0; background:transparent; border:none; text-align:center;
  font-family:'JetBrains Mono',monospace; font-size:1.05rem; font-weight:700; color:var(--text);
  padding:0 2px; height:44px;
}
.rir-chip-row{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
.rir-chip{background:var(--surface-3); border:1px solid var(--border); color:var(--text-muted); font-family:'JetBrains Mono',monospace; font-size:0.78rem; padding:9px 0; border-radius:8px; flex:1; min-width:40px; text-align:center; min-height:38px;}
.rir-chip.sel{background:var(--steel-dim); border-color:#4fc3dc55; color:var(--steel); font-weight:700;}
.rir-lbl-row{font-size:0.62rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin-top:10px; margin-bottom:2px;}
.set-card-rm{background:none; border:none; color:var(--text-dim); font-size:1.2rem; padding:8px; min-width:36px;}
.plate-hint{margin-top:10px; background:var(--surface-3); border-radius:8px; padding:9px 10px; font-size:0.75rem; color:var(--text-muted); display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.plate-hint b{color:var(--gold); font-family:'JetBrains Mono',monospace;}
.plate-chip-sm{background:var(--gold-dim); color:var(--gold); border-radius:5px; padding:2px 7px; font-family:'JetBrains Mono',monospace; font-size:0.72rem;}
.barbell-toggle-row{display:flex; align-items:center; justify-content:space-between; padding:8px 0;}

.mg-chip{background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted); border-radius:20px; padding:8px 14px; font-size:0.78rem; font-family:'Oswald',sans-serif; letter-spacing:0.3px;}
.mg-chip.active{background:var(--accent); color:var(--accent-text); border-color:var(--accent);}

/* ---- Water tracking ---- */
.water-hero{display:flex; flex-direction:column; align-items:center; padding:20px 0 6px;}
.water-jar{width:170px; height:210px; position:relative; border-radius:36px 36px 66px 66px; overflow:hidden; background:var(--surface-2); border:3px solid var(--border); box-shadow:inset 0 0 24px rgba(0,0,0,0.35);}
.water-fill{position:absolute; bottom:0; left:0; width:100%; background:linear-gradient(180deg,#5fd0ff,#0288d1); transition:height 0.7s cubic-bezier(.34,1.2,.4,1);}
.water-wave{position:absolute; left:0; width:200%; height:18px;}
.water-wave svg{display:block; width:50%; height:100%;}

<script>
/* ================= DATA ================= */
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const EXLIB = {
  Chest:['Bench Press','Incline Bench Press','Decline Bench Press','Dumbbell Bench Press','Incline Dumbbell Press','Machine Chest Press','Cable Fly','Pec Deck','Push-Ups'],
  Back:['Deadlift','Sumo Deadlift','Trap Bar Deadlift','Rack Pull','Lat Pulldown','Pull-Ups','Chin-Ups','Seated Cable Row','Chest Supported Row','Barbell Row','T-Bar Row','Single Arm Dumbbell Row','Machine Row','Face Pull'],
  Shoulders:['Overhead Press','Shoulder Press','Dumbbell Shoulder Press','Machine Shoulder Press','Arnold Press','Lateral Raise','Front Raise','Rear Delt Fly','Reverse Pec Deck','Shrugs'],
  Biceps:['Dumbbell Curl','Barbell Curl','Hammer Curl','Preacher Curl','Cable Curl'],
  Triceps:['Triceps Pushdown','Rope Pushdown','Overhead Cable Extension','Skull Crusher','Dumbbell Overhead Extension','Dips'],
  Legs:['Squat','Front Squat','Hack Squat','Leg Press','Bulgarian Split Squat','Leg Extension','Leg Curl','Romanian Deadlift','Stiff Leg Deadlift','Calf Raise','Bodyweight Squat','Lunges'],
  Core:['Crunch','Cable Crunch','Hanging Leg Raise','Plank','Leg Raise','Side Plank','Wall Sit','Hollow Body Hold','L-Sit','Ab Wheel Rollout'],
  Cardio:['Treadmill','Stationary Bike','Rowing Machine','Stair Climber','Elliptical','Outdoor Running','Walking','Cycling'],
  Other:[]
};

/* ---- Exercise Type / Tracking Mode system ----
   Every exercise's *logging UI* is driven by a trackingMode:
   - 'weight_reps' (default): Weight + Reps          — Bench Press, Squat, Lat Pulldown...
   - 'bodyweight'            : Reps + optional Added Weight — Push-Ups, Pull-Ups, Dips...
   - 'timed'                 : Duration only (live timer)   — Plank, Wall Sit, Dead Hang...
   - 'cardio'                : Duration + Distance (+ optional Speed/Incline) — Treadmill, Cycling...
   Existing plan/workout data that predates this system has no `trackingMode` field —
   inferTrackingMode() gives it a sensible default so nothing old ever breaks. */
const TRACKING_MODES = {
  weight_reps: 'Weight + Reps',
  bodyweight: 'Bodyweight (Reps)',
  timed: 'Timed (Duration)',
  cardio: 'Cardio (Duration + Distance)'
};
const TIMED_EXERCISE_NAMES = ['plank','side plank','wall sit','hollow body hold','dead hang','l-sit','isometric hold'];
const BODYWEIGHT_EXERCISE_NAMES = ['push-ups','push-up','pull-ups','pull-up','chin-ups','chin-up','dips','dip','bodyweight squat','lunges','ab wheel rollout'];
function inferTrackingMode(name, muscleGroup){
  const n=(name||'').trim().toLowerCase();
  if(TIMED_EXERCISE_NAMES.includes(n)) return 'timed';
  if(BODYWEIGHT_EXERCISE_NAMES.includes(n)) return 'bodyweight';
  if((muscleGroup||'')==='Cardio') return 'cardio';
  return 'weight_reps';
}
function getExerciseTracking(ex){
  return ex.trackingMode || inferTrackingMode(ex.name, ex.muscleGroup);
}
function fmtMMSS(totalSec){
  totalSec = Math.max(0, Math.round(totalSec||0));
  const m = Math.floor(totalSec/60), s = totalSec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

let settings = {name:'', weightUnit:'kg', restDefault:90, sound:true, soundIntensity:'normal', vibration:true, setupDone:false, barWeight:20, plateSizes:[25,20,15,10,5,2.5,1.25], weightIncrement:2.5, calorieTarget:2200, proteinTarget:150};
let plan = {}; // { Monday:{name,isRest,exercises:[{id,name,muscleGroup,sets,reps,rest,notes,warmup,isBarbell,supersetGroup}]}, ... }
let workouts = []; // completed workouts
let activeWorkout = null;
let bodymetrics = {bodyweight:[], measurements:[]};
let progressPhotos = []; // [{id,date,note,weight,bodyFat,dataUrl}] — LOCAL ONLY, not cloud-synced
let dietLog = {}; // { 'YYYY-MM-DD': [{id,name,calories,protein,qty}] }
let water = {
  entries: [], // [{id, amount, timestamp, date}]
  goalMl: 3000,
  servingMl: 300,
  takesCreatine: false,
  reminders: { enabled:false, intervalMin:60, startTime:'08:00', endTime:'22:00', sound:'drop' }
};
let waterHistoryDate = null; // ISO date currently viewed in Water tab history (null = today)

let view = 'dashboard';
let expandedExId = null; // in workout screen
let planActiveDay = DAYS[0];
let progressSelectedExercise = null;
let favoriteExerciseIds = []; // persisted — user-picked "Top Exercises" for the PR card. Empty = show all (default, matches old behavior).
let progressRange = 'all';
let progressMetric = 'weight'; // weight | 1rm
let historySearch = '';
let calMonthOffset = 0;
let netOnline = navigator.onLine;
let dietViewDate = todayISO();

let restTimer = {seconds:0, total:0, running:false, intervalId:null};

/* ================= UTIL ================= */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
const QUOTES = [
  "Discipline beats motivation.",
  "One more rep. One more step.",
  "Consistency builds strength.",
  "Show up. Do the work.",
  "Small progress is still progress.",
  "Your future self will thank you.",
  "Train today. Grow tomorrow.",
  "Every rep is a vote for who you're becoming.",
  "Strong is a decision, not a gift.",
  "The weight doesn't lie. Neither does effort.",
  "Progress, not perfection.",
  "Better than yesterday. That's the only goal.",
  "Sweat now, shine later.",
  "No shortcuts. Just reps.",
  "Comfort is the enemy of growth.",
  "Push. Recover. Repeat.",
  "Slow progress beats no progress.",
  "You don't find motivation. You build it.",
  "The hard days build the strongest days.",
  "Focus on the rep in front of you.",
  "Discipline is choosing this over easy.",
  "One workout won't change you. Showing up will.",
  "Strength is earned in silence.",
  "Today's effort is tomorrow's strength.",
  "Nobody regrets a finished workout.",
  "Keep the promise you made to yourself.",
  "The bar doesn't care about excuses.",
  "Small weights, big consistency.",
  "You're stronger than the last excuse you made.",
  "Show up even when it's hard. Especially then.",
  "Every set counts. Even the ugly ones.",
  "Build the habit. The results will follow.",
];
function getDailyQuote(){
  const ref = new Date(2024,0,1).getTime();
  const daysSince = Math.floor((Date.now()-ref)/86400000);
  const idx = ((daysSince % QUOTES.length) + QUOTES.length) % QUOTES.length;
  return QUOTES[idx];
}
function streakMessage(streak){
  if(streak<=0) return "Today is a fresh start. Let's build the next streak.";
  if(streak<3) return "Keep it going!";
  if(streak<7) return "Building momentum — don't stop now.";
  if(streak<14) return "One week strong. Keep the momentum!";
  if(streak<30) return "Two weeks of consistency. That's serious discipline.";
  return "Incredible consistency. This is who you are now.";
}
function greetingPrefix(){
  const h = new Date().getHours();
  if(h<12) return 'Good morning';
  if(h<17) return 'Good afternoon';
  return 'Good evening';
}
function getPreviousSameWeekdayWorkout(dayName, excludeId){
  return pastWorkoutsSorted().find(w=> w.dayName===dayName && w.id!==excludeId) || null;
}
function generateProgressInsight(){
  const totalWorkouts = workouts.length;
  if(totalWorkouts<3){
    return {status:'Not Enough Data', icon:'ℹ️', message:'Complete a few more workouts to see your progress trend.'};
  }
  const thisWk = getWeekWorkouts(0);
  const wkVols = [0,1,2,3,4].map(n=>{
    const ws=getWeekWorkouts(n);
    return ws.reduce((s,w)=>s+workoutVolume(w),0);
  });
  const currentVol = wkVols[0];
  const priorAvg = (wkVols[1]+wkVols[2]+wkVols[3]+wkVols[4])/4;
  const freqThis = thisWk.length;
  const freqPrior = ([1,2,3,4].reduce((s,n)=>s+getWeekWorkouts(n).length,0))/4;
  const streak = computeStreak();

  let volTrend = 'flat';
  if(priorAvg>0){
    const pct=(currentVol-priorAvg)/priorAvg;
    if(pct>0.1) volTrend='up';
    else if(pct<-0.15) volTrend='down';
  }
  let freqTrend='flat';
  if(freqThis>freqPrior+0.5) freqTrend='up';
  else if(freqThis<freqPrior-0.5) freqTrend='down';

  if(volTrend==='up' && (freqTrend==='up'||freqTrend==='flat')){
    return {status:'Strong', icon:'📈', message:'Your training volume is trending upward and your frequency is holding steady. Keep it up.'};
  }
  if(volTrend==='flat' && freqTrend!=='down' && streak>=3){
    return {status:'Steady', icon:'📊', message:'Your workout frequency is consistent and your training is holding a steady pace.'};
  }
  if(volTrend==='down' || freqTrend==='down'){
    return {status:'Needs Consistency', icon:'⚠️', message:'Your recent volume or frequency has dipped compared to your usual pace. A couple of solid sessions will turn it around.'};
  }
  return {status:'Maintaining', icon:'➡️', message:'You\'re maintaining a stable training pattern. Small consistent effort adds up.'};
}

function calcPlates(targetWeight){
  const bar = settings.barWeight || 20;
  let perSide = (targetWeight - bar) / 2;
  if(perSide <= 0) return {combo:[], achieved: bar, exact: targetWeight===bar};
  const sizes = (settings.plateSizes||[25,20,15,10,5,2.5,1.25]).slice().sort((a,b)=>b-a);
  let remaining = Math.round(perSide*100)/100;
  const combo=[];
  sizes.forEach(sz=>{
    while(remaining >= sz - 0.001){
      combo.push(sz);
      remaining = Math.round((remaining-sz)*100)/100;
    }
  });
  const achievedPerSide = combo.reduce((a,b)=>a+b,0);
  const achieved = bar + achievedPerSide*2;
  return {combo, achieved, exact: Math.abs(achieved-targetWeight)<0.01};
}

/* ================= APP VERSION / GITHUB RELEASE UPDATE CHECK ================= */
// Bump this on every release. Keep in sync with android/app/build.gradle versionName.
const APP_VERSION = '2.0.0';
const GITHUB_REPO = 'VinitGujjar/GYM-workout-tracker';
const GITHUB_RELEASES_API = `https://api.github.com/repos/${GITHUB_REPO}/releases/latest`;
const GITHUB_RELEASES_PAGE = `https://github.com/${GITHUB_REPO}/releases/latest`;
const UPDATE_CHECK_INTERVAL_MS = 6*60*60*1000; // 6 hours
let updateCheckedThisSession = false;

function compareVersions(a, b){
  // returns -1 if a<b, 0 if equal, 1 if a>b — proper major.minor.patch comparison (not string compare)
  const pa = String(a||'0').replace(/^v/i,'').split('.').map(n=>parseInt(n,10)||0);
  const pb = String(b||'0').replace(/^v/i,'').split('.').map(n=>parseInt(n,10)||0);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){
    const x=pa[i]||0, y=pb[i]||0;
    if(x<y) return -1;
    if(x>y) return 1;
  }
  return 0;
}
function findApkAsset(assets){
  if(!Array.isArray(assets)) return null;
  const apks = assets.filter(a=> a.name && a.name.toLowerCase().endsWith('.apk'));
  if(!apks.length) return null;
  // prefer the most recently updated APK asset if multiple exist
  apks.sort((x,y)=> new Date(y.updated_at||0) - new Date(x.updated_at||0));
  return apks[0];
}
/**
 * Checks GitHub Releases for a newer version.
 * force=true bypasses the 6-hour cache and the once-per-session guard (used by the manual
 * Settings button); force=false is used for the silent startup check.
 * Never throws — always resolves to a result object so callers can render UI safely.
 */
async function checkForUpdates(force){
  if(!force){
    if(updateCheckedThisSession) return {status:'skipped'};
    const lastCheck = Number(lsGet('lastUpdateCheck')||0);
    if(Date.now()-lastCheck < UPDATE_CHECK_INTERVAL_MS) return {status:'skipped'};
  }
  if(typeof navigator!=='undefined' && navigator.onLine===false){
    return {status:'offline'};
  }
  updateCheckedThisSession = true;
  lsSet('lastUpdateCheck', String(Date.now()));
  try{
    const res = await fetch(GITHUB_RELEASES_API, { headers:{ 'Accept':'application/vnd.github+json' } });
    if(!res.ok) return {status:'error'};
    const data = await res.json();
    if(!data || !data.tag_name) return {status:'error'};
    const latestVersion = String(data.tag_name).replace(/^v/i,'');
    const isNewer = compareVersions(latestVersion, APP_VERSION) > 0;
    if(!isNewer) return {status:'up-to-date', latestVersion};
    const apk = findApkAsset(data.assets);
    return {
      status: 'update-available',
      latestVersion,
      releaseUrl: data.html_url || GITHUB_RELEASES_PAGE,
      releaseNotes: data.body || '',
      hasApk: !!apk,
    };
  }catch(e){
    return {status:'error'};
  }
}
function parseReleaseNotesLines(body){
  // Escape first (never inject raw GitHub markdown/HTML), then take up to 6 bullet-ish lines for a short preview.
  const safe = escapeHtml(body||'').split('\n').map(l=>l.trim()).filter(Boolean);
  return safe.slice(0,6);
}
function openUpdateModal(result){
  const overlay=document.createElement('div');
  overlay.className='modal-overlay center';
  const modal=document.createElement('div');
  modal.className='modal';
  const notesLines = parseReleaseNotesLines(result.releaseNotes);
  modal.innerHTML=`<div class="modal-head"><div class="modal-title">🚀 Update Available</div><button class="modal-close">✕</button></div>
    <div style="text-align:center; margin-bottom:16px;">
      <div style="font-family:'Oswald',sans-serif; font-size:1.05rem;">GYM Workout Tracker v${escapeHtml(result.latestVersion)} is available</div>
      <div style="color:var(--text-muted); font-size:0.8rem; margin-top:4px;">You're using v${escapeHtml(APP_VERSION)}</div>
    </div>
    ${notesLines.length?`<div class="card" style="background:var(--surface-2); margin-bottom:16px;">
      <div class="card-title" style="margin-bottom:8px;">What's new</div>
      ${notesLines.map(l=>`<div style="font-size:0.82rem; color:var(--text-muted); padding:3px 0;">• ${l.replace(/^[-*•]\s*/,'')}</div>`).join('')}
    </div>`:''}
    ${!result.hasApk?`<div style="font-size:0.76rem; color:var(--text-dim); margin-bottom:12px;">Update found, but the APK isn't attached to this release yet — try again shortly.</div>`:`<div style="font-size:0.72rem; color:var(--text-dim); margin-bottom:14px;">Download the latest APK from GitHub Releases. Android may ask you to allow installation from this source.</div>`}
    <div style="display:flex; gap:10px;">
      <button class="btn" id="updateLaterBtn" style="flex:1;">Later</button>
      <button class="btn btn-primary" id="updateNowBtn" style="flex:1;">Update Now</button>
    </div>`;
  overlay.appendChild(modal);
  document.getElementById('modalRoot').appendChild(overlay);
  overlay.querySelector('.modal-close').onclick=()=>overlay.remove();
  overlay.querySelector('#updateLaterBtn').onclick=()=>overlay.remove();
  overlay.querySelector('#updateNowBtn').onclick=()=>{
    window.open(result.releaseUrl || GITHUB_RELEASES_PAGE, '_blank');
    overlay.remove();

}

let sharedAudioCtx = null;
function getAudioCtx(){
  try{
    if(!sharedAudioCtx || sharedAudioCtx.state==='closed'){
      sharedAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
    }
    if(sharedAudioCtx.state==='suspended') sharedAudioCtx.resume();
    return sharedAudioCtx;
  }catch(e){ return null; }
}
function soundGainForIntensity(){
  const map = {soft:0.22, normal:0.38, strong:0.55};
  return map[settings.soundIntensity] || map.normal;
}
// Plays a short pleasant ascending 3-note chime through a limiter so it stays loud but clean (no distortion),
// and never touches other apps' audio focus/volume (Web Audio just mixes into the media stream).
function playChime(notes){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const peakGain = soundGainForIntensity();
  const limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -8; limiter.knee.value = 6; limiter.ratio.value = 12;
  limiter.attack.value = 0.003; limiter.release.value = 0.15;
  limiter.connect(ctx.destination);
  let t = ctx.currentTime;
  notes.forEach((freq,i)=>{
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = freq;
    o.connect(g); g.connect(limiter);
    const start = t + i*0.12;
    const dur = 0.32;
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(peakGain, start+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, start+dur);
    o.start(start); o.stop(start+dur+0.02);
  });
}

function userDocRef(){

async function connectSync(){
  try{
    if(!currentUser) return {ok:false, msg:'Please sign in with Google first.'};
    if(!syncDb) syncDb=firebase.firestore();

    syncStatus='connecting';
    const docRef=userDocRef();
    const snap=await docRef.get();
    const localBundle=bundleData();

    if(snap.exists){
      const remote=snap.data();
      if((remote.updatedAt||0) > (localBundle.updatedAt||0)){
        applyBundle(remote);
      }else{
        await docRef.set(localBundle);
      }
    }else{
      await docRef.set(localBundle);
    }

    syncConnected=true;
    syncStatus='synced';
    return {ok:true};
  }catch(e){
    syncStatus='error';
    syncConnected=false;
    return {ok:false, msg:e.message||'Could not connect to cloud sync.'};
  }
}

function sanitizeErrorMessage(msg){
  if(!msg) return msg;
  // Strip anything that looks like a JWT (three dot-separated base64url segments)
  // or a long token, so raw credentials never end up visible to the user.
  return String(msg).replace(/[A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{10,}/g, '[hidden token]')
                     .replace(/id_token=[^&\s]+/g, 'id_token=[hidden]');
}

async function signInWithGoogle(){
  try{
    if(!auth) initFirebase();

    if(isNativeApp()){
      const plugin = nativeAuthPlugin();
      if(!plugin){
        showToast('Native Google Sign-In plugin not found. Rebuild the app after installing @capacitor-firebase/authentication.');
        return;
      }
      // Step 1: trigger native Google sign-in — this establishes a native Google/Firebase session
      // and returns a result containing the Google OAuth credential.
      // useCredentialManager:false avoids "No credentials available" on devices/emulators
      // without a Credential Manager-registered Google account.
      const result = await plugin.signInWithGoogle({ useCredentialManager: false });
      console.log('Native signInWithGoogle result shape — top-level keys:', result ? Object.keys(result) : null, '| credential keys:', (result && result.credential) ? Object.keys(result.credential) : null);

      // Step 2: pull the Google OAuth ID token out of the result. IMPORTANT — this must be
      // result.credential.idToken (the Google OAuth ID token), NOT plugin.getIdToken()
      // (which returns a Firebase Auth ID token — a different, incompatible token that
      // GoogleAuthProvider.credential() will reject with auth/invalid-credential).
      const googleIdToken = result && result.credential && result.credential.idToken;
      if(!googleIdToken){
        throw new Error('Google sign-in succeeded, but no Google ID token was returned.');
      }

      // Step 3: bridge that native session into the Web Firebase SDK, so auth.currentUser
      // and onAuthStateChanged (and the rest of the app's existing sync logic) pick it up.
      try{
        await auth.signInWithCredential(firebase.auth.GoogleAuthProvider.credential(googleIdToken));
        console.log('Web Firebase user bridged, uid:', auth.currentUser && auth.currentUser.uid);
      }catch(bridgeErr){
        // Log the real error code/message for debugging via chrome://inspect — never guess
        // the cause in the user-facing message, since it can be wrong and mislead debugging.
        console.error('signInWithCredential failed. code:', bridgeErr.code, 'message:', bridgeErr.message);
        throw new Error('Google sign-in failed to complete (' + (bridgeErr.code || 'unknown error') + '). Check chrome://inspect logs for details.');
      }
    }else{
      const provider=new firebase.auth.GoogleAuthProvider();
      try{
        await auth.signInWithPopup(provider);
      }catch(popupErr){
        if(popupErr.code==='auth/popup-blocked' || popupErr.code==='auth/cancelled-popup-request' || popupErr.code==='auth/popup-closed-by-user'){
          await auth.signInWithRedirect(provider);
        }else{
          throw popupErr;
        }
      }
    }
  }catch(e){
    console.error('Google sign-in error:',e);
    showToast(sanitizeErrorMessage(e.message)||'Google sign-in failed.');
  }
}

async function signOutGoogle(){
  try{

      const plugin = nativeAuthPlugin();
      if(plugin && plugin.signOut){

}

async function connectSyncCode(code){
  try{
    code = (code||'').trim();
    if(!code) return {ok:false, msg:'Enter a code first.'};
    if(!window.firebase) throw new Error('Firebase SDK failed to load.');
    if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(firebaseConfig);
    syncDb = firebase.firestore();
    auth = firebase.auth();
    if(!auth.currentUser){
      try{
        await auth.signInAnonymously();
      }catch(authErr){

          return {ok:false, msg:'Anonymous sign-in is disabled in Firebase Console. Enable it under Authentication → Sign-in method → Anonymous, then try again.'};
        }
        throw authErr;
      }
    }
    manualSyncCode = code;
    lsSet('manualSyncCode', code);
    syncStatus='connecting';
    const docRef = manualDocRef();
    const snap = await docRef.get();
    const localBundle = bundleData();
    if(snap.exists){
      const remote = snap.data();
      if((remote.updatedAt||0) > (localBundle.updatedAt||0)){
        applyBundle(remote);
      }else{
        await docRef.set(localBundle);
      }
    }else{
      await docRef.set(localBundle);
    }
    manualSyncActive = true;
    syncConnected = true;
    syncStatus = 'synced';
    return {ok:true};
  }catch(e){
    syncStatus='error';
    return {ok:false, msg:e.message||'Could not connect with this code.'};
  }
}
async function disconnectSyncCode(){
  manualSyncCode=null; manualSyncActive=false; syncConnected=false; syncStatus='off';
  lsDelete('manualSyncCode');
}
async function tryAutoConnectSyncCode(){
  const saved = lsGet('manualSyncCode');
  if(saved){
    const r = await connectSyncCode(saved);
    if(r.ok && typeof render==='function') render();
  }
}

/* ================= HISTORY / STATS HELPERS ================= */
function pastWorkoutsSorted(){ return [...workouts].sort((a,b)=> b.date.localeCompare(a.date) || b.startTime-a.startTime); }
function historyForExercise(exId, excludeWorkoutId){
  const rows=[];
  pastWorkoutsSorted().forEach(w=>{
    if(w.id===excludeWorkoutId) return;
    (w.exercises||[]).forEach(e=>{
      if(e.exerciseId===exId){
        const working=(e.sets||[]).filter(s=>s.type!=='warmup' && s.weight!=='' && s.reps!=='' && s.weight!=null && s.reps!=null);
        if(working.length) rows.push({date:w.date, sets:working, workoutId:w.id});
      }
    });
  });
  return rows;
}
function historyForExerciseDuration(exId, excludeWorkoutId){
  // for 'timed'/'cardio' tracking modes — sets identified by durationSec instead of weight/reps
  const rows=[];
  pastWorkoutsSorted().forEach(w=>{
    if(w.id===excludeWorkoutId) return;
    (w.exercises||[]).forEach(e=>{
      if(e.exerciseId===exId){
        const working=(e.sets||[]).filter(s=>s.type!=='warmup' && Number(s.durationSec)>0);
        if(working.length) rows.push({date:w.date, sets:working, workoutId:w.id});
      }
    });
  });
  return rows;
}
function bestSetForExercise(exId, excludeWorkoutId){
  let best=null;
  historyForExercise(exId, excludeWorkoutId).forEach(row=>{
    row.sets.forEach(s=>{
      if(!best || s.weight>best.weight || (s.weight===best.weight && s.reps>best.reps)) best={weight:s.weight, reps:s.reps, date:row.date};
    });
  });
  return best;
}
function maxWeightForExercise(exId, excludeWorkoutId){
  let max=0;
  historyForExercise(exId, excludeWorkoutId).forEach(row=> row.sets.forEach(s=>{ if(s.weight>max) max=s.weight; }));
  return max;
}
function exerciseVolume(sets){
  return (sets||[]).filter(s=>s.type!=='warmup' && s.weight!=='' && s.reps!=='' && s.weight!=null && s.reps!=null)
    .reduce((sum,s)=> sum + (Number(s.weight)*Number(s.reps)), 0);
}
function workoutVolume(w){ return (w.exercises||[]).reduce((s,e)=> s+exerciseVolume(e.sets), 0); }
function workoutWorkingSets(w){ return (w.exercises||[]).reduce((s,e)=> s+(e.sets||[]).filter(x=>x.type!=='warmup' && x.weight!=='' && x.reps!=='').length, 0); }
function workoutTotalReps(w){ return (w.exercises||[]).reduce((s,e)=> s+(e.sets||[]).filter(x=>x.type!=='warmup' && x.reps!=='').reduce((a,x)=>a+Number(x.reps||0),0), 0); }
function allExercisesWithHistory(){
  const map={};
  workouts.forEach(w=> (w.exercises||[]).forEach(e=>{
    if(!map[e.exerciseId]) map[e.exerciseId]={id:e.exerciseId, name:e.name, trackingMode:getExerciseTracking(e)};
  }));
  return Object.values(map);
}
function computeStreak(){
  // consecutive scheduled workout days completed, walking back from today, skipping rest days
  let streak=0; let d=new Date();
  for(let i=0;i<400;i++){
    const iso=d.toISOString().slice(0,10);
    const dayName=d.toLocaleDateString('en-US',{weekday:'long'});
    const isRest = plan[dayName] && plan[dayName].isRest;
    const done = workouts.some(w=>w.date===iso);
    if(done){ streak++; }
    else if(isRest){ /* skip, don't break */ }
    else if(iso===todayISO()){ /* today not done yet, don't break streak */ }
    else{ break; }
    d.setDate(d.getDate()-1);
  }
  return streak;
}
function computeBestStreak(){
  if(!workouts.length) return 0;
  const doneDates = new Set(workouts.map(w=>w.date));
  const firstDate = workouts.reduce((min,w)=> w.date<min?w.date:min, workouts[0].date);
  let d = new Date(firstDate+'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  let cur=0, best=0;
  let guard=0;
  while(d<=today && guard<3660){
    guard++;
    const iso = d.toISOString().slice(0,10);
    const dayName = d.toLocaleDateString('en-US',{weekday:'long'});
    const isRest = plan[dayName] && plan[dayName].isRest;
    if(doneDates.has(iso)){ cur++; if(cur>best) best=cur; }
    else if(isRest){ /* skip, streak continues */ }
    else if(iso===todayISO()){ /* today not done yet, don't break */ }
    else { cur=0; }
    d.setDate(d.getDate()+1);
  }
  return Math.max(best, computeStreak());
}
function allTimeStats(){
  const totalWorkouts = workouts.length;
  const totalSets = workouts.reduce((s,w)=>s+workoutWorkingSets(w),0);
  const totalReps = workouts.reduce((s,w)=>s+workoutTotalReps(w),0);
  const totalVolume = workouts.reduce((s,w)=>s+workoutVolume(w),0);
  let weeklyFreq = 0;
  if(totalWorkouts){
    const dates = workouts.map(w=>new Date(w.date+'T00:00:00').getTime());
    const minD = Math.min(...dates);
    const weeks = Math.max(1, (Date.now()-minD)/(7*24*3600*1000));
    weeklyFreq = totalWorkouts/weeks;
  }
  return {totalWorkouts, totalSets, totalReps, totalVolume, weeklyFreq, currentStreak:computeStreak(), bestStreak:computeBestStreak()};
}

function getWeekWorkouts(offsetWeeks){
  const now=new Date();
  const day=(now.getDay()+6)%7; // Mon=0
  const monday=new Date(now); monday.setDate(now.getDate()-day-offsetWeeks*7);

  return workouts.filter(w=>{ const d=new Date(w.date+'T12:00:00'); return d>=monday && d<=sunday; });
}

/* ================= START / END WORKOUT ================= */
function makeEmptySetForMode(mode, prevSet){
  if(mode==='timed') return {type:'working', durationSec:0};
  if(mode==='cardio') return {type:'working', durationSec:0, distanceKm:''};
  if(mode==='bodyweight') return {type:'working', weight: prevSet?prevSet.weight:0, reps:''};
  return {type:'working', weight: prevSet?prevSet.weight:'', reps:'', rir:''};
}
function startWorkout(dayName){
  const dp=plan[dayName];
  const exercises = dp.exercises.map(e=>{
    const mode = getExerciseTracking(e);
    const hist = historyForExercise(e.id, null);
    const prevSets = hist[0] ? hist[0].sets : [];
    const sets=[];
    for(let i=0;i<(e.sets||3);i++){
      const src = prevSets[i] || prevSets[prevSets.length-1] || null;
      sets.push(makeEmptySetForMode(mode, src));
    }
    return {exerciseId:e.id, name:e.name, muscleGroup:e.muscleGroup||'', trackingMode:mode, equipment:e.equipment||'', restTime:e.rest||settings.restDefault, isBarbell:!!e.isBarbell, supersetGroup:e.supersetGroup||null, notes:'', sets};
  });
  activeWorkout = {
    id: uid(), date: todayISO(), dayName, planName: dp.name||dayName,
    startTime: Date.now(), endTime:null, durationSec:0, notes:'',
    exercises
  };
  expandedExId = exercises.length ? exercises[0].exerciseId : null;
  saveActiveWorkout();
  navigate('workout');
  startWorkoutTicker();
}
let workoutTickInterval=null;
function repeatWorkout(w){
  function proceed(){
    const exercises = w.exercises.map(ex=>{
      const mode = getExerciseTracking(ex);
      const hist = historyForExercise(ex.exerciseId, null);
      const prevSets = hist[0] ? hist[0].sets : [];
      const sets = ex.sets.map((s,i)=>{
        const src = prevSets[i] || prevSets[prevSets.length-1] || null;
        return makeEmptySetForMode(mode, src);
      });
      return {exerciseId:ex.exerciseId, name:ex.name, muscleGroup:ex.muscleGroup||'', trackingMode:mode, equipment:ex.equipment||'', restTime:ex.restTime||settings.restDefault, isBarbell:!!ex.isBarbell, supersetGroup:ex.supersetGroup||null, notes:'', sets};
    });
    activeWorkout = {
      id: uid(), date: todayISO(), dayName: w.dayName, planName: w.planName,
      startTime: Date.now(), endTime:null, durationSec:0, notes:'',
      exercises
    };
    expandedExId = exercises.length ? exercises[0].exerciseId : null;
    saveActiveWorkout();
    showToast('Workout repeated — let\'s go 💪');
    navigate('workout');
    startWorkoutTicker();
  }
  if(activeWorkout){
    showConfirmModal('You have a workout already in progress. Starting this will replace it. Continue?', proceed, {title:'Replace Active Workout?', okLabel:'Continue', danger:true});
  }else{
    proceed();
  }
}
function startWorkoutTicker(){
  clearInterval(workoutTickInterval);
  workoutTickInterval=setInterval(()=>{
    if(view==='workout' && activeWorkout){
      const el=document.getElementById('liveTimer');
      if(el) el.textContent=fmtClock((Date.now()-activeWorkout.startTime)/1000);
    }
  },1000);
}

      group.forEach((gex,gi)=> wrap.appendChild(renderTrackExerciseCard(gex, `${ex.supersetGroup}${gi+1} — `)));
      list.appendChild(wrap);
      i=j;
    }else{
      list.appendChild(renderTrackExerciseCard(ex));
      i++;
    }
  }
  app.appendChild(list);

  const addNote=document.createElement('div');
  addNote.className='card section-sp';
  addNote.innerHTML=`<div class="card-title">Workout Notes</div>
    <textarea class="ex-notes" id="workoutNotesInput" placeholder="How did it feel today?">${escapeHtml(activeWorkout.notes)}</textarea>`;
  addNote.querySelector('textarea').oninput=(e)=>{ activeWorkout.notes=e.target.value; saveActiveWorkout(); };
  app.appendChild(addNote);

  const spacer=document.createElement('div'); spacer.style.height='90px';
  app.appendChild(spacer);
}

function renderTrackExerciseCard(ex, labelPrefix){
  const isOpen = expandedExId===ex.exerciseId;
  const mode = getExerciseTracking(ex);
  const card=document.createElement('div');
  card.className='ex-track-card'+(isOpen?' open':'');
  const workingDone = mode==='timed'||mode==='cardio'
    ? ex.sets.filter(s=>s.type!=='warmup' && Number(s.durationSec)>0).length
    : mode==='bodyweight'
      ? ex.sets.filter(s=>s.type!=='warmup' && s.reps!=='' && s.reps!=null).length
      : ex.sets.filter(s=>s.type!=='warmup' && s.weight!=='' && s.reps!=='').length;
  const head=document.createElement('div');
  head.className='ex-track-head';
  head.innerHTML=`<div><div class="ex-track-name">${labelPrefix?`<span class="ss-badge">${escapeHtml(labelPrefix.trim().replace(/—$/,'').trim())}</span>`:''}${escapeHtml(ex.name)}${ex.equipment?` <span class="ex-equip-tag">${escapeHtml(ex.equipment)}</span>`:''}</div><div class="ex-track-sub">${workingDone}/${ex.sets.filter(s=>s.type!=='warmup').length} sets logged${ex.muscleGroup?' · '+escapeHtml(ex.muscleGroup):''}</div></div><span class="chevron">▾</span>`;
  head.onclick=()=>{ expandedExId = isOpen? null : ex.exerciseId; render(); };
  card.appendChild(head);

  if(isOpen){
    const body=document.createElement('div');
    body.className='ex-track-body';

    if(mode==='timed' || mode==='cardio'){
      const hist = historyForExerciseDuration(ex.exerciseId, activeWorkout.id);
      const last = hist[0];
      const prevBox=document.createElement('div');
      prevBox.className='prev-box';
      if(last){
        prevBox.innerHTML=`<div class="pb-label">Last time — ${fmtDateShort(last.date)}</div>
          <div class="prev-chips">${last.sets.map(s=> mode==='cardio' ? `<span class="set-chip">${fmtMMSS(s.durationSec)}${s.distanceKm?' · '+s.distanceKm+'km':''}</span>` : `<span class="set-chip">${fmtMMSS(s.durationSec)}</span>`).join('')}</div>`;
      }else{
        prevBox.innerHTML=`<div class="pb-label">First time logging this</div><div style="font-size:0.8rem; color:var(--text-muted);">Log today's ${mode==='cardio'?'session':'hold'} — this becomes your baseline.</div>`;
      }
      body.appendChild(prevBox);
    }else{
      const hist = historyForExercise(ex.exerciseId, activeWorkout.id);
      const last = hist[0];
      const best = bestSetForExercise(ex.exerciseId, activeWorkout.id);
      const prevBox=document.createElement('div');
      prevBox.className='prev-box';
      if(last){
        prevBox.innerHTML=`<div class="pb-label">Last time — ${fmtDateShort(last.date)}</div>
          <div class="prev-chips">${last.sets.map(s=>`<span class="set-chip">${s.weight}${wu()} × ${s.reps}</span>`).join('')}</div>
          ${best?`<div class="pb-label" style="margin-top:10px;">Best</div><div class="prev-chips"><span class="set-chip" style="background:var(--gold-dim); color:var(--gold); border-color:#e8b64c44;">${best.weight}${wu()} × ${best.reps}</span></div>`:''}
          <div class="suggestion-txt">💡 ${suggestionText(last)}</div>`;
      }else{
        prevBox.innerHTML=`<div class="pb-label">First time logging this</div><div style="font-size:0.8rem; color:var(--text-muted);">Log today's sets — this becomes your baseline.</div>`;
      }
      body.appendChild(prevBox);
    }
    var hist = (mode==='timed'||mode==='cardio') ? historyForExerciseDuration(ex.exerciseId, activeWorkout.id) : historyForExercise(ex.exerciseId, activeWorkout.id);

    const setsWrap=document.createElement('div');
    ex.sets.forEach((s,i)=> setsWrap.appendChild(renderSetRow(ex,s,i)));
    body.appendChild(setsWrap);

    const addRow=document.createElement('div');
    addRow.className='add-set-row';
    addRow.innerHTML=`<button class="warmup-btn">+ Warm-up Set</button><button>+ Add Set</button>`;
    addRow.children[0].onclick=()=>{ ex.sets.push(Object.assign(makeEmptySetForMode(mode,null), {type:'warmup'})); saveActiveWorkout(); render(); };
    addRow.children[1].onclick=()=>{
      const inherited = mode==='weight_reps'||mode==='bodyweight' ? lastUsableSet(ex, hist) : null;
      ex.sets.push(makeEmptySetForMode(mode, inherited));
      saveActiveWorkout(); render();
    };
    body.appendChild(addRow);

    const restCtrl=document.createElement('div');
    restCtrl.className='rest-ctrl-row';
    if(ex.restTime==null) ex.restTime = settings.restDefault || 90;
    restCtrl.innerHTML=`
      <div class="rest-ctrl-lbl">Rest Timer</div>
      <div class="rest-ctrl-inner">
        <button class="stepper-btn" data-act="rt-">−</button>
        <input class="rest-ctrl-input" type="number" inputmode="numeric" value="${ex.restTime}">
        <span class="rest-ctrl-unit">sec</span>
        <button class="stepper-btn" data-act="rt+">+</button>
        <button class="rest-start-btn">▶ Start</button>
      </div>`;
    const rtInput = restCtrl.querySelector('.rest-ctrl-input');
    const setRt = (v)=>{ ex.restTime = Math.max(5, Math.round(v)); rtInput.value = ex.restTime; saveActiveWorkout(); };
    restCtrl.querySelector('[data-act="rt-"]').onclick=()=> setRt(ex.restTime-15);
    restCtrl.querySelector('[data-act="rt+"]').onclick=()=> setRt(ex.restTime+15);
    rtInput.oninput=(e)=>{ if(e.target.value!=='') setRt(Number(e.target.value)); };
    restCtrl.querySelector('.rest-start-btn').onclick=()=> startRest(ex.restTime);
    body.appendChild(restCtrl);

    if(ex.isBarbell){
      const toggleWrap=document.createElement('div');
      toggleWrap.style.cssText='margin-top:10px; font-size:0.72rem; color:var(--text-dim);';

      body.appendChild(toggleWrap);
    }

    const notes=document.createElement('textarea');
    notes.className='ex-notes'; notes.placeholder='Notes for this exercise (seat position, grip, etc.)';
    notes.value=ex.notes||'';
    notes.oninput=(e)=>{ ex.notes=e.target.value; saveActiveWorkout(); };
    body.appendChild(notes);

    card.appendChild(body);
  }
  return card;
}
function suggestionText(last){
  if(!last || !last.sets.length) return 'Log a few sessions to unlock suggestions.';
  const top = last.sets.reduce((a,b)=> (b.reps>a.reps? b:a), last.sets[0]);
  if(top.reps>=12) return `Try adding 2.5${wu()} next time — you hit ${top.reps} reps at ${top.weight}${wu()}.`;
  if(top.reps>=10) return `Close to a jump — aim for 1-2 more reps at ${top.weight}${wu()}, or a small weight bump.`;
  return `Aim to match or beat last time: ${top.weight}${wu()} × ${top.reps}.`;
}
function lastUsableSet(ex, hist){
  // prefer most recent working set already logged in THIS session
  for(let i=ex.sets.length-1;i>=0;i--){
    const s=ex.sets[i];
    if(s.type!=='warmup' && s.weight!=='' && s.weight!=null && s.reps!=='' && s.reps!=null){
      return {weight:s.weight, reps:s.reps};
    }
  }
  // else fall back to previous session's top set
  if(hist && hist[0] && hist[0].sets.length){
    const top = hist[0].sets.reduce((a,b)=> (b.reps>a.reps? b:a), hist[0].sets[0]);
    return {weight:top.weight, reps:top.reps};
  }
  return null;
}

function renderSetRow(ex,s,i){
  const mode = getExerciseTracking(ex);
  if(mode==='timed') return renderTimedSetRow(ex,s,i);
  if(mode==='cardio') return renderCardioSetRow(ex,s,i);
  return renderWeightRepsSetRow(ex,s,i,mode); // 'weight_reps' or 'bodyweight'
}
function renderWeightRepsSetRow(ex,s,i,mode){
  const isBodyweight = mode==='bodyweight';
  const isWarm = s.type==='warmup';
  const isDone = isBodyweight ? (s.reps!=='' && s.reps!=null) : (s.weight!=='' && s.weight!=null && s.reps!=='' && s.reps!=null);
  const card=document.createElement('div');
  card.className='set-card'+(isDone?' done':'');
  const wInc = settings.weightIncrement || 2.5;
  const weightLbl = isBodyweight ? `Added Weight (${wu()}) · optional` : `Weight (${wu()})`;

  card.innerHTML=`
    <div class="set-card-top">
      <div class="set-card-tag ${isWarm?'warm':''}">${isWarm?'🔸 Warm-up':'SET '+(i+1)} <span class="set-card-done-badge">✓ LOGGED</span></div>
      <button class="set-card-rm" title="Remove set">✕</button>
    </div>
    <div class="stepper-group">
      <div class="stepper-block">
        <div class="stepper-lbl">${weightLbl}</div>
        <div class="stepper-row">
          <button class="stepper-btn" data-act="w-">−</button>
          <input class="stepper-input" type="number" inputmode="decimal" placeholder="0" value="${s.weight}">
          <button class="stepper-btn" data-act="w+">+</button>
        </div>
      </div>
      <div class="stepper-block">
        <div class="stepper-lbl">Reps</div>
        <div class="stepper-row">
          <button class="stepper-btn" data-act="r-">−</button>
          <input class="stepper-input" type="number" inputmode="numeric" placeholder="0" value="${s.reps}">
          <button class="stepper-btn" data-act="r+">+</button>
        </div>
      </div>
    </div>
    ${isBodyweight?'':`<div class="rir-lbl-row">RIR (optional)</div>
    <div class="rir-chip-row">
      ${['','0','1','2','3','4'].map(v=>`<button class="rir-chip ${s.rir===v?'sel':''}" data-rir="${v}">${v===''?'—':(v==='4'?'4+':v)}</button>`).join('')}
    </div>`}
    <div class="plate-hint" style="display:none;"></div>
  `;
  const wInput = card.querySelector('.stepper-input[inputmode="decimal"]');
  const rInput = card.querySelector('.stepper-input[inputmode="numeric"]');
  const plateHint = card.querySelector('.plate-hint');

  function commitWeight(v){
    s.weight = v===''||v==null ? '' : Math.max(0, Math.round(Number(v)*100)/100);
    wInput.value = s.weight;
    saveActiveWorkout(); refreshCardState();
  }
  function commitReps(v){
    s.reps = v===''||v==null ? '' : Math.max(0, Math.round(Number(v)));
    rInput.value = s.reps;
    saveActiveWorkout(); refreshCardState();
  }
  function refreshCardState(){
    const done = isBodyweight ? (s.reps!=='' && s.reps!=null) : (s.weight!=='' && s.weight!=null && s.reps!=='' && s.reps!=null);
    card.classList.toggle('done', done);
    updatePlateHint();
    if(done && s.type!=='warmup'){
      const priorBest = bestSetForExercise(ex.exerciseId, activeWorkout.id);
      const beats = !priorBest || Number(s.weight)>priorBest.weight || (Number(s.weight)===priorBest.weight && Number(s.reps)>priorBest.reps);
      if(beats && !s._prShown){
        s._prShown = true;
        showToast(`🏆 New PR! ${s.weight}${wu()} × ${s.reps}`);
      }
    }
  }
  function updatePlateHint(){
    if(!isBodyweight && ex.isBarbell && s.weight!=='' && s.weight!=null && Number(s.weight)>0){
      const r = calcPlates(Number(s.weight));
      if(r.combo.length===0){
        plateHint.style.display='flex';
        plateHint.innerHTML = `🏋️ Just the bar (${settings.barWeight||20}${wu()})`;
      }else{
        plateHint.style.display='flex';
        plateHint.innerHTML = `🏋️ Per side: ${r.combo.map(p=>`<span class="plate-chip-sm">${p}</span>`).join('')}` + (r.exact?'':` <span style="color:var(--text-dim);">(closest: <b>${r.achieved}${wu()}</b>)</span>`);
      }
    }else{
      plateHint.style.display='none';
    }
  }
  updatePlateHint();

  wInput.oninput=(e)=>{ s.weight = e.target.value===''?'':Number(e.target.value); saveActiveWorkout(); refreshCardState(); };
  rInput.oninput=(e)=>{ s.reps = e.target.value===''?'':Number(e.target.value); saveActiveWorkout(); refreshCardState(); };

  card.querySelector('[data-act="w-"]').onclick=()=> commitWeight(Math.max(0,(Number(s.weight)||0)-wInc));
  card.querySelector('[data-act="w+"]').onclick=()=> commitWeight((Number(s.weight)||0)+wInc);
  card.querySelector('[data-act="r-"]').onclick=()=> commitReps(Math.max(0,(Number(s.reps)||0)-1));
  card.querySelector('[data-act="r+"]').onclick=()=> commitReps((Number(s.reps)||0)+1);

  if(!isBodyweight){
    card.querySelectorAll('.rir-chip').forEach(chip=>{
      chip.onclick=()=>{ s.rir=chip.dataset.rir; saveActiveWorkout(); card.querySelectorAll('.rir-chip').forEach(c=>c.classList.remove('sel')); chip.classList.add('sel'); };
    });
  }
  card.querySelector('.set-card-rm').onclick=()=>{ ex.sets.splice(i,1); saveActiveWorkout(); render(); };
  return card;
}

/* ---- Timed exercises (Plank, Wall Sit, etc.) — live duration timer, separate from the Rest Timer ---- */
let liveSetTimer = { running:false, exerciseId:null, setIndex:null, intervalId:null };
function stopLiveSetTimer(){
  if(liveSetTimer.intervalId) clearInterval(liveSetTimer.intervalId);
  liveSetTimer = { running:false, exerciseId:null, setIndex:null, intervalId:null };
}
function renderTimedSetRow(ex,s,i){
  const isWarm = s.type==='warmup';
  const isDone = Number(s.durationSec)>0;
  const isRunningThis = liveSetTimer.running && liveSetTimer.exerciseId===ex.exerciseId && liveSetTimer.setIndex===i;
  const card=document.createElement('div');
  card.className='set-card timed-set-card'+(isDone?' done':'');
  card.innerHTML=`
    <div class="set-card-top">
      <div class="set-card-tag ${isWarm?'warm':''}">${isWarm?'🔸 Warm-up':'SET '+(i+1)} <span class="set-card-done-badge">✓ LOGGED</span></div>
      <button class="set-card-rm" title="Remove set">✕</button>
    </div>
    <div class="timed-set-body">
      <div class="stepper-lbl" style="text-align:center;">Duration</div>
      <div class="timed-display" id="timedDisplay-${ex.exerciseId}-${i}">${fmtMMSS(s.durationSec)}</div>
      <div class="timed-controls">
        <button class="stepper-btn" data-act="d-">−5s</button>
        <button class="timed-startpause" data-act="startpause">${isRunningThis?'⏸ Pause':'▶ Start'}</button>
        <button class="stepper-btn" data-act="d+">+5s</button>
      </div>
    </div>
  `;
  const display = card.querySelector('.timed-display');
  const startBtn = card.querySelector('[data-act="startpause"]');

  function refreshDone(){
    card.classList.toggle('done', Number(s.durationSec)>0);
  }
  function setDuration(v){
    s.durationSec = Math.max(0, Math.round(v));
    display.textContent = fmtMMSS(s.durationSec);
    saveActiveWorkout(); refreshDone();
  }
  card.querySelector('[data-act="d-"]').onclick=()=> setDuration((Number(s.durationSec)||0)-5);
  card.querySelector('[data-act="d+"]').onclick=()=> setDuration((Number(s.durationSec)||0)+5);

  startBtn.onclick=()=>{
    const alreadyRunningThis = liveSetTimer.running && liveSetTimer.exerciseId===ex.exerciseId && liveSetTimer.setIndex===i;
    stopLiveSetTimer(); // only one timed-set timer can run at once
    if(alreadyRunningThis){
      startBtn.textContent='▶ Start';
      doVibrate('light');
      return;
    }
    startBtn.textContent='⏸ Pause';
    liveSetTimer.running=true; liveSetTimer.exerciseId=ex.exerciseId; liveSetTimer.setIndex=i;
    liveSetTimer.intervalId=setInterval(()=>{
      s.durationSec = (Number(s.durationSec)||0)+1;
      display.textContent = fmtMMSS(s.durationSec);
      card.classList.add('done');
      saveActiveWorkout();
    },1000);
  };
  card.querySelector('.set-card-rm').onclick=()=>{
    if(liveSetTimer.exerciseId===ex.exerciseId && liveSetTimer.setIndex===i) stopLiveSetTimer();
    ex.sets.splice(i,1); saveActiveWorkout(); render();
  };
  return card;
}

  card.querySelector('[data-act="d-"]').onclick=()=> setDuration((Number(s.durationSec)||0)-30);

  };
  return card;
}
function startRest(seconds){
  clearInterval(restTimer.intervalId);
  restTimer.seconds=seconds; restTimer.total=seconds; restTimer.running=true;
  restTimer.intervalId=setInterval(()=>{
    restTimer.seconds--;
    if(restTimer.seconds<=0){
      clearInterval(restTimer.intervalId);
      restTimer.running=false;
      onRestComplete();
    }
    renderRestWidget();
  },1000);
  renderRestWidget();
}
function onRestComplete(){
  if(settings.sound) playBeep();
  doVibrate('medium');
  showToast('Rest complete 💪');
  renderRestWidget();
}

let restWidgetExpanded = false;
function renderRestWidget(){
  const root=document.getElementById('restWidgetRoot');
  if(!restTimer.running && restTimer.seconds<=0){ root.innerHTML=''; return; }
  if(!restTimer.running && restTimer.seconds>0){ root.innerHTML=''; return; }
  root.innerHTML = `
    <button class="rest-fab" id="restFab"><span><span class="rf-label">Rest</span>${fmtClock(restTimer.seconds)}</span></button>
    ${restWidgetExpanded ? `<div class="rest-popover" id="restPopover">
      <button class="rw-btn" id="rwMinus">−15s</button>
      <button class="rw-btn" id="rwPlus">+15s</button>
      <button class="rw-btn" id="rwSkip">Skip</button>
    </div>` : ''}`;
  document.getElementById('restFab').onclick=()=>{ restWidgetExpanded=!restWidgetExpanded; renderRestWidget(); };
  if(restWidgetExpanded){
    document.getElementById('rwMinus').onclick=(ev)=>{ ev.stopPropagation(); restTimer.seconds=Math.max(0,restTimer.seconds-15); if(restTimer.seconds===0){ clearInterval(restTimer.intervalId); restTimer.running=false; onRestComplete(); } renderRestWidget(); };
    document.getElementById('rwPlus').onclick=(ev)=>{ ev.stopPropagation(); restTimer.seconds+=15; renderRestWidget(); };
    document.getElementById('rwSkip').onclick=(ev)=>{ ev.stopPropagation(); clearInterval(restTimer.intervalId); restTimer.running=false; restTimer.seconds=0; restWidgetExpanded=false; renderRestWidget(); };
  }
}

function endWorkout(){
  clearInterval(workoutTickInterval);
  stopLiveSetTimer();
  activeWorkout.endTime=Date.now();
  activeWorkout.durationSec=Math.floor((activeWorkout.endTime-activeWorkout.startTime)/1000);
  if(settings.sound) playCompletionSound();
  doVibrate('heavy');
  showSummaryModal(activeWorkout);
}

function showSummaryModal(w){
  const prevSameePlan = getPreviousSameWeekdayWorkout(w.dayName, w.id);
  const vol = workoutVolume(w);
  const sets = workoutWorkingSets(w);
  const reps = workoutTotalReps(w);
  let weightPRs=0, repPRs=0;
  const progressLines=[];
  w.exercises.forEach(ex=>{
    const hist = historyForExercise(ex.exerciseId, w.id);
    const prevRow = hist[0];
    const todayWorking = ex.sets.filter(s=>s.type!=='warmup' && s.weight!=='' && s.reps!=='');
    if(!todayWorking.length) return;
    const todayTop = todayWorking.reduce((a,b)=> (Number(b.weight)>Number(a.weight)||(Number(b.weight)===Number(a.weight)&&Number(b.reps)>Number(a.reps)))?b:a, todayWorking[0]);
    if(prevRow && prevRow.sets.length){
      const prevTop = prevRow.sets.reduce((a,b)=> (b.weight>a.weight||(b.weight===a.weight&&b.reps>a.reps))?b:a, prevRow.sets[0]);
      if(Number(todayTop.weight)>prevTop.weight) weightPRs++;
      else if(Number(todayTop.weight)===prevTop.weight && Number(todayTop.reps)>prevTop.reps) repPRs++;
      progressLines.push({name:ex.name, prev:`${prevTop.weight}${wu()} × ${prevTop.reps}`, today:`${todayTop.weight}${wu()} × ${todayTop.reps}`});
    }else{
      progressLines.push({name:ex.name, prev:'—', today:`${todayTop.weight}${wu()} × ${todayTop.reps}`});
    }
  });
  const prevVol = prevSameePlan ? workoutVolume(prevSameePlan) : null;
  const volDiffPct = prevVol!=null && prevVol>0 ? Math.round(((vol-prevVol)/prevVol)*1000)/10 : null;
  const prevSets = prevSameePlan ? workoutWorkingSets(prevSameePlan) : null;
  const prevDur = prevSameePlan ? prevSameePlan.durationSec : null;

  // preview streak as if this workout is saved
  workouts.push(w);
  const previewStreak = computeStreak();
  workouts.pop();

  let analysis;
  const totalPRs = weightPRs+repPRs;
  if(!prevSameePlan){
    analysis = `First recorded ${w.dayName} workout 🎉 — this becomes your baseline for next time.`;
  }else if(totalPRs>0){
    analysis = `Excellent session — you hit ${totalPRs} new PR${totalPRs>1?'s':''}${volDiffPct!=null?`, and volume changed ${volDiffPct>=0?'+':''}${volDiffPct}% vs last ${w.dayName}`:''}.`;
  }else if(volDiffPct!=null && volDiffPct>5){
    analysis = `Strong session — your total volume increased by ${volDiffPct}% compared with last ${w.dayName}.`;
  }else if(volDiffPct!=null && volDiffPct<-10){
    analysis = `Volume was a bit lower today, but you still showed up — that's what builds the streak.`;
  }else{
    analysis = `Solid, consistent session compared with last ${w.dayName}.`;
  }

  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML=`<div class="modal glass-card">
    <div class="summary-hero"><div class="se">🎉</div><h2>Workout Complete</h2><div class="sw">${escapeHtml(w.dayName)} — ${escapeHtml(w.planName)}</div></div>
    <div class="sum-stat-grid">
      <div class="sum-stat"><div class="sn">${fmtDuration(w.durationSec)}</div><div class="sl">Duration</div></div>
      <div class="sum-stat"><div class="sn">${w.exercises.length}</div><div class="sl">Exercises</div></div>
      <div class="sum-stat"><div class="sn">${sets}</div><div class="sl">Sets</div></div>
      <div class="sum-stat"><div class="sn">${reps}</div><div class="sl">Reps</div></div>
    </div>
    <div class="card" style="background:var(--surface-2); margin-bottom:14px;">
      <div class="card-title">Total Volume</div>
      <div style="font-family:'JetBrains Mono',monospace; font-size:1.3rem; font-weight:700;">${Math.round(vol).toLocaleString()} ${wu()}</div>
    </div>
    <div class="insight-card glass-card" style="margin-bottom:14px; border-left-color:var(--accent);">
      <div class="insight-msg" style="color:var(--text); font-size:0.85rem;">${escapeHtml(analysis)}</div>
    </div>
    ${previewStreak>0?`<div class="card" style="background:var(--gold-dim); border-color:#e8b64c44; margin-bottom:14px;">
      <div style="font-family:'Oswald',sans-serif; font-size:0.9rem; color:var(--gold);">🔥 ${previewStreak} Day Streak</div>
      <div style="font-size:0.78rem; color:var(--text-muted); margin-top:3px;">${escapeHtml(streakMessage(previewStreak))}</div>
    </div>`:''}
    ${progressLines.length?`<div class="card-title" style="margin-top:6px;">Today's Progress</div>
    <div class="card" style="background:var(--surface-2);">${progressLines.map(p=>`<div class="progress-line"><span>${escapeHtml(p.name)}</span><span class="mono">${p.prev} <span class="pl-arrow">→</span> ${p.today}</span></div>`).join('')}</div>`:''}
    ${(weightPRs+repPRs)>0?`<div class="card-title" style="margin-top:14px;">Personal Records</div>
    <div class="card" style="background:var(--gold-dim); border-color:#e8b64c44;">
      ${weightPRs>0?`<div class="pr-line">🏆 +${weightPRs} Weight PR${weightPRs>1?'s':''}</div>`:''}
      ${repPRs>0?`<div class="pr-line">🔥 +${repPRs} Rep PR${repPRs>1?'s':''}</div>`:''}
    </div>`:''}
    ${prevSameePlan?`<div class="card-title" style="margin-top:14px;">vs Last ${escapeHtml(w.dayName)}</div>
    <div class="card" style="background:var(--surface-2);">
      <div class="compare-row"><span>Volume</span><span class="compare-val ${volDiffPct>=0?'up':'down'}">${volDiffPct>0?'+':''}${volDiffPct}%</span></div>
      <div class="compare-row"><span>Sets</span><span class="compare-val ${sets>=prevSets?'up':'down'}">${sets-prevSets===0?'Same':(sets-prevSets>0?'+':'')+(sets-prevSets)}</span></div>
      <div class="compare-row"><span>Duration</span><span class="compare-val ${w.durationSec<=prevDur?'up':'down'}">${w.durationSec-prevDur===0?'Same':(w.durationSec>prevDur?'+':'')+Math.round((w.durationSec-prevDur)/60)+'m'}</span></div>
    </div>`:`<div class="card-title" style="margin-top:14px;">vs Last ${escapeHtml(w.dayName)}</div><div class="card" style="background:var(--surface-2); font-size:0.82rem; color:var(--text-muted);">First recorded ${escapeHtml(w.dayName)} workout 🎉 — nothing to compare yet.</div>`}
    <div class="form-group section-sp">
      <label class="form-label">Notes</label>
      <textarea class="ex-notes" id="finalNotes">${escapeHtml(w.notes)}</textarea>
    </div>
    <button class="btn btn-primary btn-full" id="saveWorkoutBtn">Save Workout</button>
  </div>`;
  document.getElementById('modalRoot').appendChild(overlay);
  document.getElementById('saveWorkoutBtn').onclick=async ()=>{
    w.notes = document.getElementById('finalNotes').value;
    workouts.push(w);
    await saveWorkouts();
    activeWorkout=null;
    await saveActiveWorkout();
    overlay.remove();
    showToast('Workout saved 💪');
    navigate('dashboard');
  };
}

function renderPlanExerciseCard(dp,e,i){
  const card=document.createElement('div');
  card.className='plan-ex-card';
  card.innerHTML=`
    <div class="plan-ex-top">
      <div>
        <div class="plan-ex-name">${e.supersetGroup?`<span class="ss-badge">${escapeHtml(e.supersetGroup)}${supersetIndexLabel(dp,e)}</span>`:''}${escapeHtml(e.name)}</div>

      </div>

        <button class="icon-btn" data-act="up" ${i===0?'style="opacity:0.3;"':''}>↑</button>

      </div>
    </div>

      <span id="restLbl">${e.rest}s rest</span>
      ${e.isBarbell?'<span>🏋️ Barbell</span>':''}
    </div>
  `;
  card.querySelector('[data-act="up"]').onclick=()=>{ if(i>0){ [dp.exercises[i-1],dp.exercises[i]]=[dp.exercises[i],dp.exercises[i-1]]; savePlan(); render(); } };
  card.querySelector('[data-act="down"]').onclick=()=>{ if(i<dp.exercises.length-1){ [dp.exercises[i+1],dp.exercises[i]]=[dp.exercises[i],dp.exercises[i+1]]; savePlan(); render(); } };
  card.querySelector('[data-act="del"]').onclick=()=>{
    showConfirmModal(`Remove ${e.name} from ${planActiveDay}?`, ()=>{ dp.exercises.splice(i,1); savePlan(); render(); }, {title:'Remove Exercise', okLabel:'Remove', danger:true});
  };
  card.onclick=(ev)=>{ if(ev.target.closest('.icon-btn')) return; openExerciseConfig(dp,e); };
  return card;
}
function supersetIndexLabel(dp,e){
  if(!e.supersetGroup) return '';
  const members = dp.exercises.filter(x=>x.supersetGroup===e.supersetGroup);
  const idx = members.indexOf(e);
  return String(idx+1);
}

      </div>
      <button class="btn btn-primary btn-full" id="mgSaveBtn" style="margin-top:10px;" disabled>Save Exercise</button>`;
    overlay.querySelector('.modal-close').onclick=()=>overlay.remove();
    let selected = null;
    let selectedTracking = 'weight_reps';
    const opts = modal.querySelector('#mgOptions');
    MUSCLE_GROUPS.forEach(g=>{
      const chip=document.createElement('button');
      chip.type='button';
      chip.className='mg-chip';
      chip.textContent=g;

        selected=g;
        opts.querySelectorAll('.mg-chip').forEach(c=>c.classList.remove('active'));

        if(g==='Cardio'){

          trackOpts.querySelectorAll('.mg-chip').forEach(c=>c.classList.toggle('active', c.dataset.tm==='cardio'));
